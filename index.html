// Consulta de quem pode trabalhar em altura: ASO dentro da validade, resultado "Apto" para altura e curso NR 35 em dia (reciclagem de 2 anos).
const parseBR = s => { const m = /^(\d{2})\/(\d{2})\/(\d{4})$/.exec(String(s || '').trim()); return m ? new Date(+m[3], +m[2] - 1, +m[1]) : null; };
const fmtBR = d => `${pad2(d.getDate())}/${pad2(d.getMonth() + 1)}/${d.getFullYear()}`;
function situacaoVol(v) {
  const h = new Date(); h.setHours(0, 0, 0, 0);
  const val = parseBR(v.validade), nr = parseBR(v.nr35Data);
  if (nr) nr.setFullYear(nr.getFullYear() + 2);
  const aso = !!val && val >= h, altura = norm(v.altura) === 'apto', nrOk = !!nr && nr >= h;
  return { aso, altura, nr, nrOk, sit: aso && altura && nrOk ? 'apto' : aso && altura ? 'nr35' : 'inapto' };
}
const ROT_SIT = { apto: ['Apto para altura', 'b-ok'], nr35: ['Falta NR 35 válida', 'b-warn'], inapto: ['Não apto', 'b-err'] };

// ---------- Importação de lista (Excel / PDF) ----------
// A leitura é feita no navegador (bibliotecas carregadas só quando o botão é usado); o servidor recebe apenas as linhas já extraídas.
const LIBS = {
  xlsx: ['https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js', () => window.XLSX],
  pdf: ['https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js', () => window.pdfjsLib]
};
async function carregarLib(k) {
  const [src, pronto] = LIBS[k];
  if (!pronto()) {
    await new Promise((ok, err) => {
      const s = document.createElement('script'); s.src = src; s.onload = ok;
      s.onerror = () => err(new Error('Não foi possível carregar a biblioteca de leitura de ' + (k === 'pdf' ? 'PDF' : 'Excel') + '. Verifique a conexão e tente de novo.'));
      document.head.appendChild(s);
    });
  }
  if (k === 'pdf') pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
}

const CAMPOS_VOL = ['nome', 'codigo', 'casa', 'dataExame', 'validade', 'altura', 'confinado', 'restricoes', 'nr35Data'];
const ROT_CAMPO = { nome: 'nome', codigo: 'código', casa: 'casa de oração', dataExame: 'data do exame', validade: 'validade do ASO', altura: 'altura', confinado: 'espaço confinado', restricoes: 'restrições', nr35Data: 'NR 35' };

function normData(v) {
  v = String(v == null ? '' : v).trim();
  let m = /^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{2,4})/.exec(v);
  if (m) { const y = m[3].length === 2 ? '20' + m[3] : m[3]; return `${pad2(+m[1])}/${pad2(+m[2])}/${y}`; }
  m = /^(\d{4})-(\d{2})-(\d{2})/.exec(v);
  return m ? `${m[3]}/${m[2]}/${m[1]}` : '';
}
function normApto(v) { const t = norm(v); if (!t) return ''; return /nao|inapto|impedido|restri/.test(t) ? 'Não apto' : /apto/.test(t) ? 'Apto' : String(v).trim(); }

// Descobre quais colunas são quais pelo texto do cabeçalho.
function mapaCabecalho(cells) {
  const m = {};
  cells.forEach((h, i) => {
    const t = norm(h); if (!t) return;
    const nr = /nr.?-?\s?35|curso|treinamento|capacit/.test(t);
    let k = null;
    if (nr && /validade|vencimento|vence/.test(t)) k = 'nr35Validade';
    else if (nr) k = 'nr35Data';
    else if (/codigo|^cod\b|matricula/.test(t)) k = 'codigo';
    else if (/^nome/.test(t) || t === 'voluntario') k = 'nome';
    else if (/casa|igreja|local/.test(t)) k = 'casa';
    else if (/data.*(exame|aso)|^exame|^aso$/.test(t)) k = 'dataExame';
    else if (/validade|vencimento/.test(t)) k = 'validade';
    else if (/altura/.test(t)) k = 'altura';
    else if (/confinado/.test(t)) k = 'confinado';
    else if (/restri|observ/.test(t)) k = 'restricoes';
    if (k && !(k in m)) m[k] = i;
  });
  return m;
}

// rows: matriz de células (texto). Devolve { lista, avisos }.
function extrairVol(rows, pdf) {
  const lista = [], avisos = [];
  let h = -1, mapa = null;
  for (let i = 0; i < Math.min(rows.length, 40); i++) {
    const m = mapaCabecalho(rows[i]);
    if ('nome' in m && Object.keys(m).length >= 2) { h = i; mapa = m; break; }
  }
  if (mapa) {
    rows.slice(h + 1).forEach(r => {
      const nome = String(r[mapa.nome] || '').trim();
      if (!nome || !/[a-zà-ú]/i.test(nome)) return;
      const o = { nome };
      if ('codigo' in mapa) o.codigo = String(r[mapa.codigo] || '').trim();
      if ('casa' in mapa) o.casa = String(r[mapa.casa] || '').trim();
      if ('dataExame' in mapa) o.dataExame = normData(r[mapa.dataExame]);
      if ('validade' in mapa) o.validade = normData(r[mapa.validade]);
      if ('altura' in mapa) o.altura = normApto(r[mapa.altura]);
      if ('confinado' in mapa) o.confinado = normApto(r[mapa.confinado]);
      if ('restricoes' in mapa) o.restricoes = String(r[mapa.restricoes] || '').trim();
      if ('nr35Data' in mapa) o.nr35Data = normData(r[mapa.nr35Data]);
      else if ('nr35Validade' in mapa) { const d = parseBR(normData(r[mapa.nr35Validade])); if (d) { d.setFullYear(d.getFullYear() - 2); o.nr35Data = fmtBR(d); } }
      lista.push(o);
    });
    const reconhecidos = Object.keys(mapa).map(k => k === 'nr35Validade' ? 'NR 35 (validade)' : ROT_CAMPO[k]);
    avisos.push('Colunas reconhecidas: ' + reconhecidos.join(', ') + '.');
    return { lista, avisos };
  }
  if (!pdf) throw new Error('Não encontrei a coluna "Nome" no arquivo. A primeira linha da tabela precisa ter os títulos das colunas (Nome, Código, Casa de oração, Validade, NR 35…).');
  // PDF sem cabeçalho reconhecível: linhas "NOME  data  [data]"
  rows.forEach(r => {
    const t = r.join(' ').replace(/\s+/g, ' ').trim();
    const datas = (t.match(/\d{1,2}[\/.-]\d{1,2}[\/.-]\d{2,4}/g) || []).map(normData);
    const nome = (t.match(/^(?:\d+\s+)?([A-Za-zÀ-ÿ'.\- ]{5,}?)(?=\s+\d|\s*$)/) || [])[1];
    if (!nome || nome.trim().split(' ').length < 2 || !datas.length) return;
    const o = { nome: nome.trim() };
    if (datas.length === 1) o.nr35Data = datas[0]; else { o.dataExame = datas[0]; o.validade = datas[1]; }
    lista.push(o);
  });
  if (lista.length) avisos.push('O PDF não tem títulos de coluna: considerei nome + datas. Com uma data, ela foi lida como conclusão do NR 35; com duas, como data do exame e validade do ASO. Confira a prévia.');
  return { lista, avisos };
}

function celulasPlanilha(ws) {
  const rg = XLSX.utils.decode_range(ws['!ref'] || 'A1');
  const rows = [];
  for (let r = rg.s.r; r <= rg.e.r; r++) {
    const linha = [];
    for (let c = rg.s.c; c <= rg.e.c; c++) {
      const cel = ws[XLSX.utils.encode_cell({ r, c })];
      let v = '';
      if (cel) {
        if (cel.t === 'n' && cel.z && XLSX.SSF.is_date(cel.z)) { const d = XLSX.SSF.parse_date_code(cel.v); v = d ? `${pad2(d.d)}/${pad2(d.m)}/${d.y}` : String(cel.w || cel.v); }
        else v = String(cel.w != null ? cel.w : (cel.v != null ? cel.v : ''));
      }
      linha.push(v.trim());
    }
    rows.push(linha);
  }
  return rows;
}

async function lerPlanilhaVol(arq) {
  await carregarLib('xlsx');
  const wb = XLSX.read(await arq.arrayBuffer(), { type: 'array' });
  let ultimo = null;
  for (const nome of wb.SheetNames) {
    try { const r = extrairVol(celulasPlanilha(wb.Sheets[nome]), false); if (r.lista.length) return r; } catch (e) { ultimo = e; }
  }
  throw ultimo || new Error('Nenhum voluntário encontrado na planilha.');
}

// Agrupa os pedaços de texto do PDF por linha (posição vertical) e por coluna (lacunas horizontais).
function linhasPdf(items) {
  const lin = [];
  items.filter(i => i.str && i.str.trim()).forEach(i => {
    const y = i.transform[5]; let l = lin.filter(x => Math.abs(x.y - y) < 3)[0];
    if (!l) { l = { y, it: [] }; lin.push(l); }
    l.it.push({ s: i.str, x: i.transform[4], w: i.width || 0 });
  });
  lin.sort((a, b) => b.y - a.y);
  return lin.map(l => {
    l.it.sort((a, b) => a.x - b.x);
    const cels = []; let u = null;
    l.it.forEach(t => {
      if (u && t.x - (u.x + u.w) < 9) { u.s += (t.x - (u.x + u.w) > 1 ? ' ' : '') + t.s; u.w = t.x + t.w - u.x; }
      else { u = { s: t.s, x: t.x, w: t.w }; cels.push(u); }
    });
    return cels.map(c => c.s.trim());
  });
}

async function lerPdfVol(arq) {
  await carregarLib('pdf');
  const pdf = await pdfjsLib.getDocument({ data: new Uint8Array(await arq.arrayBuffer()) }).promise;
  let rows = [];
  for (let p = 1; p <= pdf.numPages; p++) { const tc = await (await pdf.getPage(p)).getTextContent(); rows = rows.concat(linhasPdf(tc.items)); }
  if (!rows.length) throw new Error('Não encontrei texto no PDF (parece um PDF escaneado, só imagem). Use a planilha Excel ou digite os dados.');
  return extrairVol(rows, true);
}

// Aplica a lista sobre a atual (mesma regra do servidor): atualiza só campos presentes no arquivo, inclui quem não existe.
function mesclarVol(atual, entrada) {
  const lista = atual.map(v => Object.assign({}, v));
  const porCodigo = {}, porNome = {};
  let max = 0;
  lista.forEach(v => { if (v.codigo) porCodigo[v.codigo] = v; porNome[norm(v.nome)] = v; max = Math.max(max, Number(v.id) || 0); });
  const novos = [], atualizados = [];
  entrada.forEach(e => {
    const d = {}; CAMPOS_VOL.forEach(k => { const x = String(e[k] == null ? '' : e[k]).trim(); if (x) d[k] = x; });
    if (!d.nome) return;
    const v = (d.codigo && porCodigo[d.codigo]) || porNome[norm(d.nome)];
    if (v) {
      const mudou = CAMPOS_VOL.filter(k => d[k] !== undefined && d[k] !== (v[k] || ''));
      if (mudou.length) { Object.assign(v, d); atualizados.push({ nome: v.nome, mudou: mudou.map(k => ROT_CAMPO[k]) }); }
    } else {
      max++;
      const n = Object.assign({ id: String(max), codigo: '', casa: '', dataExame: '', validade: '', altura: '', confinado: '', restricoes: '', nr35Data: '' }, d);
      lista.push(n); porNome[norm(n.nome)] = n; if (n.codigo) porCodigo[n.codigo] = n; novos.push({ nome: n.nome });
    }
  });
  return { lista, novos, atualizados, iguais: entrada.length - novos.length - atualizados.length };
}

      Quem já está na lista (mesmo código ou nome) é atualizado apenas nos campos presentes no arquivo; os demais são incluídos. Nada é apagado.</p>
      <label class="btn">${ic('up')} Escolher arquivo<input type="file" id="imp-arq" hidden accept=".xlsx,.xls,.csv,.pdf,application/pdf"></label>
      <span class="muted sm" id="imp-nome" style="margin-left:8px"></span>
      <div id="imp-prev" style="margin-top:14px"></div>`,
    acoes: [{ label: 'Fechar' }, { label: 'Importar', cls: 'btn-primary', id: 'imp-ok', onClick: async () => {
      if (!lido || !lido.length) return;
      try {
        const r = await api('importarVoluntarios', { lista: lido });
        S.vol = r.lista; fecharModal(); telaVoluntarios();
        toast(`Importação concluída: ${r.novos} incluído(s), ${r.atualizados} atualizado(s).`);
      } catch (e) { falha(e); }
    } }]
  });
  $('#imp-ok').disabled = true;
  $('#imp-arq').onchange = async e => {

      lido = r.lista;
      const linhas = []
        .concat(m.novos.map(x => `<tr><td>${esc(x.nome)}</td><td><span class="bdg b-ok">Novo</span></td><td class="muted sm">—</td></tr>`))
        .concat(m.atualizados.map(x => `<tr><td>${esc(x.nome)}</td><td><span class="bdg b-warn">Atualiza</span></td><td class="sm">${esc(x.mudou.join(', '))}</td></tr>`));
      $('#imp-prev').innerHTML = `${r.avisos.map(a => `<p class="hint" style="margin:0 0 8px!important">${esc(a)}</p>`).join('')}
        <p class="txt"><b>${r.lista.length}</b> linha(s) lida(s): <b>${m.novos.length}</b> nova(s), <b>${m.atualizados.length}</b> com alteração, ${m.iguais} sem mudança.</p>
        ${linhas.length ? `<div class="tabela-wrap" style="max-height:280px;overflow:auto"><table class="tab tab-livre"><thead><tr><th>Voluntário</th><th>Ação</th><th>Campos alterados</th></tr></thead><tbody>${linhas.join('')}</tbody></table></div>` : ''}`;

      if ($('#imp-ok').disabled) $('#imp-prev').insertAdjacentHTML('beforeend', '<p class="muted sm">Nada para importar: a lista já está igual ao arquivo.</p>');
    } catch (err) { $('#imp-prev').innerHTML = ''; falha(err); }
  };
}

// Reduz a imagem no navegador para caber numa célula da planilha (~35 KB).
async function enviarImagem(chave, arq) {
  if (!arq) return;
  let url;
  if (arq.type === 'image/svg+xml' && arq.size < 30000) {
    url = await new Promise(ok => { const fr = new FileReader(); fr.onload = () => ok(fr.result); fr.readAsDataURL(arq); });
  } else {
    const img = await new Promise((ok, erro) => { const i = new Image(); i.onload = () => ok(i); i.onerror = () => erro(new Error('Imagem inválida.')); i.src = URL.createObjectURL(arq); });
    let lado = chave === 'logo' ? 700 : 260;
    for (let k = 0; k < 8; k++) {
      const f = Math.min(1, lado / Math.max(img.width, img.height));
      const cv = document.createElement('canvas'); cv.width = Math.round(img.width * f); cv.height = Math.round(img.height * f);
      const cx = cv.getContext('2d'); cx.drawImage(img, 0, 0, cv.width, cv.height);
      url = cv.toDataURL('image/png');
      if (url.length > 45000) url = (cx.globalCompositeOperation = 'destination-over', cx.fillStyle = '#fff', cx.fillRect(0, 0, cv.width, cv.height), cv.toDataURL('image/jpeg', 0.88));
      if (url.length <= 45000) break;
      lado = Math.round(lado * 0.8);
    }
  }
  S.imagens = await api('salvarImagem', { id: chave, img: url });
  DOCIMG.imagens = S.imagens;
  telaConfig();
  toast('Imagem atualizada.');
}

      const nova = String(p.nova || '');

      if (nova === SENHA_DEMO) throw new Error('A nova senha não pode ser a senha inicial.');

    },

    salvarModelo(p, u) {

        while (db.modelos.some(x => x.id === id)) id = base + '-' + (i++);
        c.id = id; m = { id, ordem: db.modelos.length + 1, ativo: true }; db.modelos.push(m);
      }
      c.id = m.id;
      Object.assign(m, { tipo: c.tipo, nome: c.nome, codigo: c.cab.documento, titulo: c.titulo || c.cab.titulo, atualizado: agora(), atualizadoPor: u.email, conteudo: c });

        if (pt.status === 'Cancelado') throw new Error('PT cancelada não pode receber vínculo.');
      }
      if ((apr.vinculo || '') === ptId) return true;
      hist(apr, u, ptId ? 'vinculada à ' + ptId : 'vínculo removido');
      apr.vinculo = ptId; apr.atualizado = agora(); salvar(); return true;
    },
    salvarAssinantes(p) {
      const d = db.docs.filter(x => x.id === p.docId)[0];
      if (!d) throw new Error('Salve o documento antes de incluir assinantes.');
      const doDoc = db.assin.filter(a => a.docId === d.id), vistos = {};
      (p.lista || []).forEach((x, i) => {
        const a = x.id && doDoc.filter(y => y.id === x.id)[0];
        if (a) { vistos[a.id] = 1; a.ordem = i + 1; if (a.status === 'Pendente') Object.assign(a, { papel: x.papel, nome: x.nome, documento: x.documento, telefone: x.telefone }); }
        else db.assin.push({ id: 'AS' + Date.now().toString(36) + i + Math.random().toString(36).slice(2, 5), docId: d.id, ordem: i + 1, papel: x.papel, nome: x.nome, documento: x.documento, telefone: x.telefone, token: tok(), status: 'Pendente', criado: agora() });
      });
      doDoc.forEach(a => { if (!vistos[a.id] && a.status === 'Pendente') a.status = 'Excluído'; if (!vistos[a.id] && a.status === 'Assinado') throw new Error('Não é possível remover quem já assinou (' + a.nome + ').'); });
      d.status = statusDoc(d); salvar(); return documento(d.id);
    },
    marcarEnviado(p) { const a = db.assin.filter(x => x.id === p.id)[0]; a.enviadoEm = agora(); salvar(); return a.enviadoEm; },
    salvarPdf() { throw new Error('Salvar no Drive só funciona com o sistema publicado no Google Apps Script.'); },
    salvarImagem(p) { if (p.img) db.imagens[p.id] = p.img; else delete db.imagens[p.id]; salvar(); return db.imagens; },
    salvarConfig(p) { Object.assign(db.config, p); salvar(); return Object.assign({ msgWhats: MSG_WHATS_PADRAO }, db.config); },
    alterarSenhaLogin(p) {
      const email = String(p.email || '').trim().toLowerCase();
      db.senhas = db.senhas || {};
      if (!email || String(p.atual) !== (db.senhas[email] || SENHA_DEMO)) throw new Error('E-mail ou senha atual inválidos.');
      const nova = String(p.nova || '');
      if (nova.length < 8 || !/[A-Za-z]/.test(nova) || !/\d/.test(nova)) throw new Error('A nova senha deve ter pelo menos 8 caracteres, com letras e números.');
      if (nova === SENHA_DEMO) throw new Error('A nova senha não pode ser a senha inicial.');
      if (nova === String(p.atual)) throw new Error('A nova senha deve ser diferente da atual.');
      db.senhas[email] = nova; salvar();
      return true;
    },
    voluntarios() { if (!db.vol) { db.vol = JSON.parse(document.getElementById('seed-voluntarios').textContent); salvar(); } return db.vol; },
    salvarVoluntario(p) {
      const lista = A.voluntarios();
      const nome = String(p.nome || '').trim();
      if (!nome) throw new Error('Informe o nome do voluntário.');
      ['dataExame', 'validade', 'nr35Data'].forEach(k => { if (p[k] && !/^\d{2}\/\d{2}\/\d{4}$/.test(String(p[k]).trim())) throw new Error('Datas devem estar no formato dd/mm/aaaa.'); });
      const campos = ['nome', 'codigo', 'casa', 'dataExame', 'validade', 'altura', 'confinado', 'restricoes', 'nr35Data'];
      let v = p.id && lista.filter(x => x.id === p.id)[0];
      if (!v) { v = { id: String(lista.reduce((m, x) => Math.max(m, Number(x.id) || 0), 0) + 1) }; lista.push(v); }
      campos.forEach(k => { v[k] = String(p[k] || '').trim(); });
      salvar(); return lista;
    },
    importarVoluntarios(p) {
      const m = mesclarVol(A.voluntarios(), p.lista || []);
      if (!(p.lista || []).length) throw new Error('Nenhum voluntário encontrado no arquivo.');
      db.vol = m.lista; salvar();
      return { lista: db.vol, novos: m.novos.length, atualizados: m.atualizados.length };
    },
    usuarios() { return [{ id: 'admin@demo', nome: 'Administrador (demo)', perfil: 'Administrador', ativo: true }]; },
    salvarUsuario() { throw new Error('Usuários só podem ser gerenciados no sistema publicado.'); },
    redefinirSenha() { throw new Error('Usuários só podem ser gerenciados no sistema publicado.'); }
  };
  const PUB = { login: 1, paraAssinar: 1, assinar: 1, alterarSenhaLogin: 1 };
  const SO_ADMIN = { salvarModelo: 1, ativarModelo: 1, restaurarModelo: 1, cancelarDocumento: 1, salvarImagem: 1, salvarConfig: 1, usuarios: 1, salvarVoluntario: 1, importarVoluntarios: 1 };
  return {
    api(action, p, token) {
      try {
        if (!db) db = carregar_();
        if (!A[action]) throw new Error('Ação inválida: ' + action);
        const u = PUB[action] ? null : user(token);
        if (u && u.trocar && action !== 'alterarSenha' && action !== 'logout') throw new Error('TROCAR_SENHA: defina uma nova senha para continuar.');
        if (SO_ADMIN[action] && u.perfil !== 'Administrador') throw new Error('Ação permitida somente para administradores.');
        return { ok: true, data: clone(A[action](p || {}, u)) };
      } catch (e) { return { ok: false, error: e.message }; }
    },
    resetar() { db = semente(); salvar(); }
  };
})();

// Caminhos em que dois conteúdos diferem (mesma lógica do diferencas_ do Code.gs).
function diferencas(a, b, p, out) {
  if (a === b) return out;
  const ta = Object.prototype.toString.call(a), tb = Object.prototype.toString.call(b);
  const composto = ta === '[object Object]' || ta === '[object Array]';
  if (ta !== tb || !composto || (ta === '[object Array]' && a.length !== b.length)) {
    const vazio = x => x == null || x === '' || x === false;
    if (!(vazio(a) && vazio(b))) out.push(p || '(documento)');
    return out;
  }
  new Set(Object.keys(a).concat(Object.keys(b))).forEach(k => diferencas(a[k], b[k], p ? p + '.' + k : k, out));
  return out;
}

// SHA-256 síncrono (usado só no modo demonstração; no servidor é o Utilities.computeDigest).
function sha256(s) {

  const b = new TextEncoder().encode(s), l = b.length, n = ((l + 9 + 63) >> 6) << 6, m = new Uint8Array(n);
  m.set(b); m[l] = 0x80;
  const dv = new DataView(m.buffer); dv.setUint32(n - 4, l * 8); dv.setUint32(n - 8, Math.floor(l / 0x20000000));
  const H = [0x6a09e667, 0xbb67ae85, 0x3c6ef372, 0xa54ff53a, 0x510e527f, 0x9b05688c, 0x1f83d9ab, 0x5be0cd19], w = new Uint32Array(64);
  const r = (x, k) => (x >>> k) | (x << (32 - k));
  for (let o = 0; o < n; o += 64) {
    for (let i = 0; i < 16; i++) w[i] = dv.getUint32(o + i * 4);
    for (let i = 16; i < 64; i++) { const s0 = r(w[i - 15], 7) ^ r(w[i - 15], 18) ^ (w[i - 15] >>> 3), s1 = r(w[i - 2], 17) ^ r(w[i - 2], 19) ^ (w[i - 2] >>> 10); w[i] = (w[i - 16] + s0 + w[i - 7] + s1) >>> 0; }
    let [a, bb, c, d, e, f, g, h] = H;
    for (let i = 0; i < 64; i++) {
      const t1 = (h + (r(e, 6) ^ r(e, 11) ^ r(e, 25)) + ((e & f) ^ (~e & g)) + K[i] + w[i]) >>> 0;
      const t2 = ((r(a, 2) ^ r(a, 13) ^ r(a, 22)) + ((a & bb) ^ (a & c) ^ (bb & c))) >>> 0;
      h = g; g = f; f = e; e = (d + t1) >>> 0; d = c; c = bb; bb = a; a = (t1 + t2) >>> 0;
    }
    H[0] = (H[0] + a) >>> 0; H[1] = (H[1] + bb) >>> 0; H[2] = (H[2] + c) >>> 0; H[3] = (H[3] + d) >>> 0; H[4] = (H[4] + e) >>> 0; H[5] = (H[5] + f) >>> 0; H[6] = (H[6] + g) >>> 0; H[7] = (H[7] + h) >>> 0;
  }
  return H.map(x => x.toString(16).padStart(8, '0')).join('');
}
