<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Assinatura eletrônica · PT e APR</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Arimo:ital,wght@0,400;0,700;1,400&family=Carlito:wght@400;700&family=Tinos:wght@400;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --marinho:#033D60; --grafite:#201E1E; --branco:#FFFFFF; --cinza-azul:#5B6B7A; --cinza-claro:#CDD4DC; --gelo:#F3F5F8;
  --ambar:#FBAE40; --ambar-esc:#C98A1B; --vermelho:#B43A3A;
  --bg:var(--gelo); --card:var(--branco); --txt:var(--grafite); --muted:var(--cinza-azul); --linha:var(--cinza-claro); --linha2:#E6EAEF;
  --pri:var(--marinho); --pri2:#0A4C74; --pri-claro:#E6EEF4; --acento:var(--marinho);
  --ok:var(--marinho); --ok-bg:#E6EEF4; --warn:var(--ambar-esc); --warn-bg:#FEF3DC; --err:var(--vermelho); --err-bg:#F7E7E7; --mute-bg:#EDF0F3;
  --whats:var(--marinho); --raio:10px; --sombra:0 1px 2px rgba(3,61,96,.05),0 3px 10px rgba(3,61,96,.05);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--txt);font:14px/1.45 Inter,"Segoe UI",Roboto,Arial,sans-serif;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;line-height:1.25}
h2{font-size:20px} h3{font-size:15px;margin-bottom:6px}
code{background:var(--mute-bg);padding:1px 5px;border-radius:4px;font-size:12px}
.muted{color:var(--muted)} .sm{font-size:12px} .dir{text-align:right} .txt{margin:0 0 6px}
.mono{font-family:Consolas,"Courier New",monospace}
.ic{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}

.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--linha);background:#fff;border-radius:8px;padding:8px 13px;cursor:pointer;font-weight:600;font-size:13px;color:var(--txt);text-decoration:none;white-space:nowrap;transition:background .15s,border-color .15s}
.btn:hover{background:var(--gelo);border-color:#B7C1CC}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-primary{background:var(--pri);border-color:var(--pri);color:#fff}
.btn-primary:hover{background:var(--pri2);border-color:var(--pri2)}
.btn-danger{background:var(--err);border-color:var(--err);color:#fff}
.btn-danger:hover{background:#9a3030}
.btn-ghost{background:transparent;border-color:transparent}
.btn-whats{background:var(--whats);border-color:var(--whats);color:#fff}
.btn-whats:hover{background:var(--pri2)}
.btn-full{width:100%;justify-content:center}
.btn-grande{padding:13px;font-size:15px}
.btn-icon{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border:1px solid transparent;border-radius:8px;background:transparent;cursor:pointer;color:var(--muted);font-size:18px;line-height:1}
.btn-icon:hover{background:var(--mute-bg);color:var(--txt)}
.btn-icon:disabled{opacity:.35;cursor:default;background:transparent}
.btn-link{background:none;border:0;padding:0;color:var(--pri2);cursor:pointer;font-weight:600;font-size:12px}
.btn-link:hover{text-decoration:underline}
.pulsa{box-shadow:0 0 0 0 rgba(251,174,64,.7);animation:pulsa 1.8s infinite}
@keyframes pulsa{70%{box-shadow:0 0 0 7px rgba(251,174,64,0)}100%{box-shadow:0 0 0 0 rgba(251,174,64,0)}}

.fld{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
.fld[hidden]{display:none}
.fld>span{font-size:12px;font-weight:600;color:var(--muted)}
input,select,textarea{border:1px solid var(--linha);border-radius:8px;padding:8px 10px;background:#fff;width:100%;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--pri2);box-shadow:0 0 0 3px rgba(3,61,96,.12)}
textarea{resize:vertical}
.grade2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px} .grade2 .col2{grid-column:1/-1}
.grade3{display:grid;grid-template-columns:repeat(3,1fr);gap:0 12px}
.aceite{display:flex;gap:9px;align-items:flex-start;font-size:13px;margin:10px 0;cursor:pointer}
.aceite input{width:18px;height:18px;margin-top:1px;flex:none}

.bdg{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11.5px;font-weight:600;white-space:nowrap}
.b-ok{background:var(--ok-bg);color:var(--ok)} .b-warn{background:var(--warn-bg);color:var(--warn)} .b-err{background:var(--err-bg);color:var(--err)} .b-mute{background:var(--mute-bg);color:var(--muted)}
.tag{display:inline-flex;align-items:center;justify-content:center;min-width:38px;padding:2px 7px;border-radius:6px;font-size:11px;font-weight:700;letter-spacing:.04em}
.tag-pt{background:#FEF3DC;color:var(--ambar-esc)} .tag-apr{background:var(--pri-claro);color:var(--marinho)}
.prog{height:6px;background:var(--linha2);border-radius:99px;overflow:hidden;width:70px;display:inline-block;vertical-align:middle;margin-right:6px}
.prog i{display:block;height:100%;background:var(--ok);border-radius:99px}
.prog.grande{width:100%;height:8px;margin:0}

.topo{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:18px;padding:8px 18px;background:#fff;border-bottom:1px solid var(--linha)}
.marca{display:flex;align-items:center;gap:10px;min-width:0}
.marca img{height:34px;width:auto}
.marca b{display:block;font-size:15px} .marca small{display:block;color:var(--muted);font-size:11.5px}
.nav{display:flex;gap:4px;margin-left:auto}
.nav button{display:flex;align-items:center;gap:7px;border:0;background:none;padding:8px 12px;border-radius:8px;cursor:pointer;font-weight:600;color:var(--muted)}
.nav button:hover{background:var(--mute-bg);color:var(--txt)}
.nav button.ativo{background:var(--pri-claro);color:var(--pri)}
.marca b{color:var(--marinho)}
.pg-topo h2{color:var(--marinho)}
.bloco h3{color:var(--marinho)}
.usuario{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);max-width:220px}
.usuario span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.pagina{max-width:1180px;margin:0 auto;padding:22px 18px 60px}
.pagina.estreita{max-width:880px}
.pg-topo{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:16px}
.pg-topo p{margin:4px 0 0}
.acoes{display:flex;gap:8px;flex-wrap:wrap}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chip{border:1px solid var(--linha);background:#fff;border-radius:999px;padding:5px 12px;cursor:pointer;font-size:12.5px;font-weight:600;color:var(--muted)}
.chip b{color:var(--txt);margin-left:3px}
.chip.ativo{background:var(--pri);border-color:var(--pri);color:#fff} .chip.ativo b{color:var(--ambar)}
.filtros{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.filtros select{width:auto;min-width:220px}
.busca{position:relative;flex:1;min-width:220px;display:block}
.busca .ic{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--muted)}
.busca input{padding-left:36px}
.tabela-wrap{background:#fff;border:1px solid var(--linha);border-radius:var(--raio);overflow:auto;box-shadow:var(--sombra)}
.tab{width:100%;border-collapse:collapse;font-size:13px}
.tab th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);padding:10px 12px;background:var(--gelo);border-bottom:1px solid var(--linha);white-space:nowrap}
.tab td{padding:10px 12px;border-bottom:1px solid var(--linha2);vertical-align:middle}
.tab tr:last-child td{border-bottom:0}
.tab tr.clicavel{cursor:pointer} .tab tr.clicavel:hover td{background:var(--gelo)}
.vazio{text-align:center;padding:48px 20px;color:var(--muted);background:#fff;border:1px dashed var(--linha);border-radius:var(--raio)}
.vazio .ic{width:40px;height:40px;opacity:.5}

.cards-mod{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.card-mod{background:#fff;border:1px solid var(--linha);border-radius:var(--raio);padding:14px;display:flex;flex-direction:column;gap:6px;box-shadow:var(--sombra)}
.card-mod.inativo{opacity:.6}
.cm-topo{display:flex;align-items:center;gap:8px}
.cm-tit{font-weight:600;min-height:38px}
.cm-bts{display:flex;gap:6px;margin-top:auto;padding-top:6px;align-items:center}
.lista-mod{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px;max-height:56vh;overflow:auto}
.item-mod{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;border:1px solid var(--linha);background:#fff;border-radius:8px;padding:10px 12px;cursor:pointer}
.item-mod:hover{border-color:var(--pri2);background:var(--pri-claro)}
.item-mod span{font-size:13px}

.bloco{background:#fff;border:1px solid var(--linha);border-radius:var(--raio);padding:18px;margin-bottom:14px;box-shadow:var(--sombra)}
.bloco .dir{margin-top:10px;display:flex;justify-content:flex-end;gap:8px}
.img-cfg{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.img-prev{border:1px solid var(--linha);border-radius:8px;padding:10px;background:#fff}
.img-prev img{display:block;height:80px;width:auto}
.img-bts{display:flex;gap:8px;flex-wrap:wrap}
.grade-ic{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.ic-cfg{border:1px solid var(--linha);border-radius:8px;padding:10px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.ic-cfg img{width:70px;height:68px;object-fit:contain}

body.com-editor{overflow:hidden}
.editor{display:flex;flex-direction:column;height:calc(100vh - 51px);height:calc(100dvh - 51px)}
.ed-barra{display:flex;align-items:center;gap:10px;padding:8px 12px;background:#fff;border-bottom:1px solid var(--linha);flex-wrap:wrap}
.ed-titulo{font-weight:700;display:flex;align-items:center;gap:8px;min-width:0;flex:1;flex-wrap:wrap}
.ed-titulo small{font-weight:500;color:var(--muted);font-size:12.5px}
.ed-acoes{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.zoom{display:flex;border:1px solid var(--linha);border-radius:8px;margin-right:4px}
.zoom .btn-icon{width:32px;height:32px}
.ed-corpo{flex:1;display:flex;min-height:0}
.ed-area{flex:1;overflow:auto;background:#E3E8ED;min-width:0}
.ed-painel{width:340px;flex:none;background:#fff;border-left:1px solid var(--linha);display:flex;flex-direction:column;min-height:0}
.painel-abas{display:flex;gap:2px;padding:8px 8px 0;border-bottom:1px solid var(--linha);align-items:flex-end}
.painel-abas button[data-aba]{border:0;background:none;padding:8px 12px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;cursor:pointer}
.painel-abas button.ativo{color:var(--pri);border-bottom-color:var(--pri)}
.fechar-painel{margin-left:auto;display:none!important}
.painel-corpo{padding:14px;overflow:auto;flex:1}
.assin-resumo{display:flex;flex-direction:column;gap:6px;margin-bottom:12px;font-size:13px}
.assin-lista{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.assin-card{border:1px solid var(--linha);border-radius:9px;padding:10px;display:flex;flex-direction:column;gap:6px}
.assin-card.ok{border-color:var(--linha);border-left:3px solid var(--marinho);background:var(--gelo)}
.ac-topo{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.ac-ass{display:flex;flex-direction:column;gap:2px}
.ac-ass img{max-height:42px;max-width:180px;object-fit:contain;align-self:flex-start}
.ac-bts{display:flex;gap:2px;align-items:center;flex-wrap:wrap}
.ac-bts .btn{padding:6px 10px;margin-right:4px}
.aviso-box,.dica-box{border:1px solid var(--linha);border-radius:9px;padding:14px;background:var(--gelo);font-size:13px}
.aviso-box{text-align:center} .aviso-box .ic{width:30px;height:30px;color:var(--pri)}
.dica-box ul{margin:6px 0 0;padding-left:18px} .dica-box li{margin-bottom:4px}
.dica{margin-top:14px}
.stepper{display:flex;align-items:center;gap:10px}
.stepper .btn-icon{border:1px solid var(--linha)}
.grade-cols{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.grade-cols label{display:flex;flex-direction:column;font-size:11px;color:var(--muted)}
.grade-cols small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grade-cols input{padding:5px 6px}
.hist{margin-top:12px;font-size:12px} .hist pre{white-space:pre-wrap;font:inherit;color:var(--muted)}
.menu{position:relative}
.menu-lista{position:absolute;right:0;top:38px;background:#fff;border:1px solid var(--linha);border-radius:9px;box-shadow:0 12px 32px rgba(0,0,0,.14);min-width:270px;padding:6px;z-index:40}
.menu-lista button{display:flex;align-items:center;gap:8px;width:100%;border:0;background:none;padding:9px 10px;border-radius:6px;cursor:pointer;text-align:left}
.menu-lista button:hover{background:var(--mute-bg)}
.menu-lista .perigo{color:var(--err)}

.pad-wrap{border:1px solid var(--linha);border-radius:9px;background:#fff;position:relative;margin:4px 0 6px}
.pad-topo{display:flex;justify-content:space-between;padding:7px 10px 0;font-size:12px;color:var(--muted)}
.pad{display:block;width:100%;height:170px;touch-action:none;cursor:crosshair}
.pad-linha{position:absolute;left:8%;right:8%;bottom:34px;border-bottom:1px dashed var(--linha);pointer-events:none}
.pdf-acoes{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}

.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:var(--gelo)}
.login-card{background:#fff;border:1px solid var(--linha);border-top:4px solid var(--marinho);border-radius:12px;padding:28px;width:100%;max-width:380px;box-shadow:var(--sombra);text-align:center}
.login-card .fld{text-align:left}
.login-logo{height:70px;width:auto;margin-bottom:10px}
.login-card h1{font-size:21px;margin-bottom:4px;color:var(--marinho)}
.login-card p{margin:0 0 18px;font-size:13px}
.pw{position:relative;display:flex}
.pw input{flex:1;padding-right:42px}
.pw .olho{position:absolute;right:3px;top:50%;transform:translateY(-50%);width:34px;height:34px;border:0;border-radius:8px;background:transparent;cursor:pointer;color:var(--muted);display:inline-flex;align-items:center;justify-content:center}
.pw .olho:hover{background:var(--mute-bg);color:var(--txt)}
.pw .olho .ic{width:19px;height:19px}
.login-links{margin-top:12px;font-size:13px}
.vol-resumo{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.vol-resumo>div{background:#fff;border:1px solid var(--linha);border-radius:10px;padding:10px 14px}
.vol-resumo b{display:block;font-size:22px;color:var(--marinho)} .vol-resumo span{font-size:12px;color:var(--muted)}
.hint{margin-top:14px!important;font-size:12px!important;color:var(--muted);background:var(--mute-bg);padding:8px;border-radius:8px}

.pub{max-width:860px;margin:0 auto;padding:14px 14px 40px}
.pub-topo{display:flex;align-items:center;gap:12px;padding:6px 2px 14px}
.pub-topo img{height:42px} .pub-topo b{display:block;font-size:16px} .pub-topo small{color:var(--muted)}
.pub-card{background:#fff;border:1px solid var(--linha);border-radius:12px;padding:16px;margin-bottom:12px;box-shadow:var(--sombra);display:flex;flex-direction:column;gap:10px}
.pub-card.ok{flex-direction:row;align-items:center;gap:14px;border-color:var(--linha);border-left:4px solid var(--marinho);background:var(--gelo)}
.pub-card.ok .ic{width:34px;height:34px;color:var(--ok)} .pub-card.ok h2{font-size:17px} .pub-card.ok p{margin:2px 0 0}
.pub-card.erro{align-items:center;text-align:center;border-color:#E6C2C2;background:var(--err-bg)}
.pub-card.erro .ic{width:34px;height:34px;color:var(--err)}
.pub-doc{display:flex;gap:10px;align-items:flex-start}
.pub-passo{display:flex;align-items:center;gap:8px;font-weight:700;margin:18px 0 8px}
.pub-passo b{display:inline-flex;width:24px;height:24px;border-radius:50%;background:var(--pri);color:#fff;align-items:center;justify-content:center;font-size:13px}
.pub-doc-wrap{background:#E3E8ED;border-radius:12px;max-height:70vh;overflow:auto;border:1px solid var(--linha)}
.pub-acoes-doc{display:flex;justify-content:flex-end;margin-top:8px}
.pub-carregando{text-align:center;padding:80px 20px;color:var(--muted)} .pub-carregando .ic{width:40px;height:40px}
.pub-rodape{font-size:11.5px;color:var(--muted);text-align:center;margin-top:20px}

.modal-bg{position:fixed;inset:0;background:rgba(32,30,30,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:100}
.modal-bg[hidden]{display:none}
.modal{background:#fff;border-radius:14px;width:100%;max-height:92vh;display:flex;flex-direction:column;box-shadow:0 24px 60px rgba(0,0,0,.25)}
.modal-cab{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--linha)}
.modal-cab h3{margin:0;font-size:16px}
.modal-corpo{padding:16px 18px;overflow:auto}
.modal-pe{display:flex;justify-content:flex-end;gap:8px;padding:12px 18px;border-top:1px solid var(--linha)}
.modal-pe[hidden]{display:none}
#toasts{position:fixed;right:16px;bottom:16px;display:flex;flex-direction:column;gap:8px;z-index:200;max-width:min(420px,calc(100vw - 32px))}
.toast{display:flex;gap:9px;align-items:flex-start;background:var(--grafite);color:#fff;padding:11px 14px;border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.25);font-size:13px;transition:opacity .4s,transform .4s}
.toast.t-erro{background:var(--vermelho)} .toast.t-aviso{background:var(--ambar-esc)}
.toast.out{opacity:0;transform:translateY(8px)}
#loading{position:fixed;inset:0;background:rgba(255,255,255,.55);display:none;align-items:center;justify-content:center;z-index:300;flex-direction:column;gap:10px;font-weight:600;color:var(--pri)}
#loading.on{display:flex}
.spinner{width:38px;height:38px;border:4px solid var(--linha);border-top-color:var(--pri);border-radius:50%;animation:gira .8s linear infinite}
@keyframes gira{to{transform:rotate(360deg)}}

@media (max-width:1100px){
  .ed-painel{position:fixed;right:0;top:51px;bottom:0;z-index:35;box-shadow:-10px 0 30px rgba(0,0,0,.15);transform:translateX(105%);transition:transform .2s}
  body.painel-aberto .ed-painel{transform:none}
  .fechar-painel{display:inline-flex!important}
}
@media (max-width:760px){
  .topo{gap:8px;padding:8px 10px}
  .marca div{display:none}
  .nav button span{display:none}
  .usuario span{display:none}
  .ed-acoes .btn span{display:none}
  .ed-acoes .btn{padding:8px 10px}
  .ed-painel{width:100%}
  .grade2,.grade3{grid-template-columns:1fr}
  .lista-mod{grid-template-columns:1fr}
  .tab:not(.tab-livre) th:nth-child(3),.tab:not(.tab-livre) td:nth-child(3),.tab:not(.tab-livre) th:nth-child(4),.tab:not(.tab-livre) td:nth-child(4){display:none}
  .filtros select{min-width:0;flex:1}
  /* listas de documentos e de voluntários: cada linha vira um cartão (sem rolagem lateral; botões sempre visíveis) */
  .tab-cartoes thead{display:none}
  .tab-cartoes,.tab-cartoes tbody,.tab-cartoes tr,.tab-cartoes td{display:block;width:100%}
  .tab-cartoes tr{position:relative;padding:12px 52px 12px 14px;border-bottom:1px solid var(--linha2)}
  .tab-cartoes.tab-docs tr{padding-right:100px}
  .tab-cartoes tr:last-child{border-bottom:0}
  .tab-cartoes td{padding:3px 0;border:0}
  .tab-cartoes td[data-l]{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .tab-cartoes td[data-l]::before{content:attr(data-l);flex:0 0 74px;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
  .tab-cartoes td.dir{position:absolute;top:8px;right:6px;width:auto;padding:0;display:flex;gap:2px}
  .tab-cartoes td.dir .btn-icon{width:42px;height:42px}
  .tab-cartoes td .sm{margin:0}
  .tab-cartoes .prog{width:70px}
  .pg-topo .acoes{width:100%} .pg-topo .acoes .btn{flex:1 1 auto;justify-content:center}
  .vol-resumo b{font-size:19px}
  .modal-bg{padding:8px;align-items:flex-end} .modal{max-height:94vh}

/2025","revisao":"28\/02\/2025"}},{"v":1,"tipo":"APR","id":"APR-024.01","nome":"Trabalho em altura","cab":{"empresa":"CCB – Congregação Cristã no Brasil","titulo":"APR - TRABALHO EM ALTURA","documento":"CCB SSMA 024.01","revisao":"00"},"titulo":"APR - TRABALHO EM ALTURA","servicoRot":"SERVIÇO A SER EXECUTADO","servico":"","campos":[{"rot":"DATA:","v":"","k":"data"},{"rot":"Casa de oração:","v":"","k":"casa"},{"rot":"RESP.:","v":"","k":"resp"}],"extras":[],"cols":[29.9,79.9,77.9,202.6,56.9,94.8],"colRot":["Ordem","Detalhamento da atividade","Perigo e Risco","Medidas de Controle","Condição","Observação"],"grupos":[{"ordem":"1","atividade":"Montagem de torre para execução de andaimes.","perigos":"1.0 - Tontura, Náusea e Vertigens\n1.1 - Queda de pessoas com diferença de nível\n1.2 - Queda de materiais\n1.3 - Tombamento da torre\n1.4 - Ferimento, contusão, prensagem dos membros","medidas":[{"texto":"1.0.0 - Deve ser realizado DDS conforme a atividade.","cond":"","obs":""},{"texto":"1.0.1 – Deve ser realizado exame preventivo.","cond":"","obs":""},{"texto":"1.0.2 - O colaborador deve está capacitado na NR-35 Trabalho em Altura","cond":"","obs":"Na inconformidade os trabalhos deverão ser suspensos e retomados quando de acordo com a NR- 35."},{"texto":"1.0.3 – Deve ser verificado as condições atmosféricas favoráveis à execução do trabalho.","cond":"","obs":""},{"texto":"1.0.4 - Toda montagem de torre para execução de andaimes deve ter acompanhamento do responsável.","cond":"","obs":""},{"texto":"1.0.5 - O encarregado deve orientar sempre a equipe sobre o serviço a ser executado.","cond":"","obs":""},{"texto":"1.1.0 – Deve se manter a área de trabalho isolada, sinalizada, limpa, organizada e desimpedida de entulhos e outros.","cond":"","obs":""},{"texto":"1.1.2 –Deve ser verificada a estabilidade do solo e do equipamento de trabalho.","cond":"","obs":""},{"texto":"1.1.3 – Deve ser utilizar plataforma de madeira de acordo com a norma até providência das aquisições de plataformas metálicas.","cond":"","obs":""},{"texto":"1.1.4 – Deve ser utilizada tábuas resistentes e de boa qualidade nas estruturas da torre para apoio dos pés e movimentação segura do corpo.","cond":"","obs":""},{"texto":"1.1.5 - As tábuas deve possuir encaixe duplo para travamento.","cond":"","obs":""},{"texto":"1.2.0 – Deve ser verificada as condições dos módulos, eliminando os que apresentarem desgastes, trincas, empenamentos, etc.","cond":"","obs":""},{"texto":"1.2.1 - Após a montagem do segundo módulo, trabalhar na parte interna da estrutura fazendo uso constante do cinto de segurança tipo pára-quedista atracado em local seguro.","cond":"","obs":""},{"texto":"1.2.2 – Deve ser utilizadas cordas novas e de boa qualidade para içamento dos módulos.","cond":"","obs":""},{"texto":"1.2.3 – Deve ser procedido o içamento de 01 (um) módulo de cada vez.","cond":"","obs":""},{"texto":"1.2.4 - Amarrar adequadamente os módulos.","cond":"","obs":""},{"texto":"1.2.5 –Deve ser afastado do local enquanto estiver subindo e montando os módulos.","cond":"","obs":""},{"texto":"1.3.0 - Para andaimes móveis somente utilizá-los sobre superfície plana e os rodízios deverão ser providos de travas, de modo a evitar deslocamentos acidentais","cond":"","obs":""},{"texto":"1.3.1 - Toda torre deve possuir uma sapata (chapa de ferro) 20x20 cm com encaixe para a colocação dos pés do primeiro módulo, a fim de facilitar o nivelamento da torre caso necessite.","cond":"","obs":""},{"texto":"1.3.2 - Deve ser efetuado o primeiro travamento quando os módulos atingirem 03 metros (três metros) de altura, e só continuar a montagem da torre depois deste travamento realizado, colocar o travamento a cada 03 metros de módulos montados.","cond":"","obs":""},{"texto":"1.3.3 – Deve ser efetuado o travamento utilizando tubo Rohr ou similar fazendo a amarração nas torres.","cond":"","obs":""},{"texto":"1.4.0 - Deve ser utilizado E.P.I's básicos necessários: capacete com jugular, óculos de segurança, luvas de raspa, botina com biqueira de aço, cinto de segurança tipo pára-quedista atracado em local seguro, a um nível mais elevado que a cabeça.","cond":"","obs":""},{"texto":"1.1.1 - No final da atividade limpar, recolher, guardar, armazenar os materiais cada um em sua classe de uso e\/ou de descarte.","cond":"","obs":""}]},{"ordem":"2","atividade":"Condição do Andaime","perigos":"2.1 - Queda de pessoas com diferença de nível\n2.2 - Queda de materiais\n2.3 - Tombamento do andaime\n2.4 - Prensagem dos membros","medidas":[{"texto":"2.1.0 - Os andaimes devem ser dimensionados e construídos de forma a suportar com segurança as cargas de trabalhos a que estarão sujeitos.","cond":"","obs":""},{"texto":"2.1.1 - Devem ser providos de passarela, plataforma de trabalho resistente, sem vãos livres, travado nas extremidades do tablado.","cond":"","obs":""},{"texto":"2.1.2 - Os andaimes devem ser providos de escadas de acesso, construída de material resistente, o espaçamento entre os degraus deve ser uniforme, não exceder a 30 centímetros e corrimão dos dois lados sem apresentar farpas ou saliências.","cond":"","obs":""},{"texto":"2.1.3 - Os andaimes devem dispor de guarda corpo de 0,90 a 1,20 metros, confeccionado de material resistente e rodapé de 0,20 metros.","cond":"","obs":""},{"texto":"2.1.4 - Nos trabalhos em altura superior a dois metros, fazer uso constante do cinto de segurança tipo pára-quedista atracado em local seguro e a um nível de altura mais elevado que a cabeça.","cond":"","obs":""},{"texto":"2.2.0 - Não permitir o uso de passagem ou acesso improvisado quando os andaimes forem instalados em área com movimentação.","cond":"","obs":""},{"texto":"2.2.1 –Deve ser providenciado o isolamento no perímetro da estrutura do andaime","cond":"","obs":""},{"texto":"2.3.0 - Os andaimes devem ser travados para evitar seu tombamento.","cond":"","obs":""},{"texto":"2.3.1 - Os montantes dos andaimes devem ser apoiados sobre calços ou sapatas capazes de resistir aos esforços e as cargas transmitidas e ser compatível com a resistência do solo.","cond":"","obs":""},{"texto":"2.3.2 - Não acumular materiais nas passarelas ou plataformas de trabalhos dos andaimes afim de não comprometer sua estabilidade.","cond":"","obs":""},{"texto":"2.4.0 – Realizar montagem com acompanhamento e atenção aos encaixes, utilizando luvas de raspa.","cond":"","obs":""}]},{"ordem":"3","atividade":"Desmontagem das torres","perigos":"3.1 - Queda de materiais\n3.2 - Queda de pessoas com diferença de nível\n3.3 - Tombamento da torre","medidas":[{"texto":"3.1.1 - Utilização dos E.P.I's básicos necessários: capacete com jugular, óculos de segurança, luvas de raspa, botina com biqueira de aço, cinto de segurança tipo pára-quedista atracado em local seguro, a um nível mais elevado que a cabeça.","cond":"","obs":""},{"texto":"3.1.2 - deve ser utilizado corda resistente e de boa qualidade para a descida dos módulos. Descer um de cada vez.","cond":"","obs":""},{"texto":"3.1.3 - Retirar os travamentos de cima para baixo, na medida em que desformando os módulos.","cond":"","obs":""},{"texto":"3.1.4 - Fazer o remanejamento das tábuas utilizadas para apoio dos pés, a cada módulo desformado.","cond":"","obs":""},{"texto":"3.2.0 - Manter todos os módulos da estrutura empilhados adequadamente em local que não interfira com movimentação de veículos, equipamentos ou pessoas.","cond":"","obs":""},{"texto":"3.3.0 – Deve ser afastado todos os funcionários quando da descida dos módulos.","cond":"","obs":""}]}],"fecho":{"seguraRot":"Após o término do trabalho a área se encontrará segura ?","segura":"","obsRot":"OBSERVAÇÕES:","obs":"","podeRot":"Serviço pode ser executado ?","pode":""},"assinRot":["NOME","Assinatura"],"assinLinhas":4,"assinAltura":37,"rod":{"preparado":"Departamento Saúde Segurança e Meio Ambiente (SSMA) - Brás","aprovado":"Coordenação SSMA","liberacao":"20\/03\/2023","revisao":"25\/03\/2023"}},{"v":1,"tipo":"APR","id":"APR-024.02","nome":"Trabalho em forros","cab":{"empresa":"CCB – Congr };
const PT_ICONES = ['altura', 'civil', 'eletrica', 'guincho', 'demolicao', 'quente', 'confinado', 'inflamavel'];
const PT_LISTA_MARGEM = [0, 14, 19, 22];        // espaço (pt) antes de cada lista da página 2, igual ao original
const PT_ATIV_LARG = [64.5, 65, 65.5, 66.5, 71, 56.5, 67, 67];

const escD = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
// Marcações simples nos textos: **negrito**, __sublinhado__ e *itálico*.
function fmt(s) {
  return escD(s).replace(new RegExp('\\*\\*([\\s\\S]+?)\\*\\*', 'g'), '<b>$1</b>').replace(/__([\s\S]+?)__/g, '<u>$1</u>').replace(new RegExp('\\*([^*\\n]+?)\\*', 'g'), '<i>$1</i>');
}
function fmtLinhas(s) {
  return String(s ?? '').split('\n').map(l => `<div class="ln">${fmt(l) || '&#8203;'}</div>`).join('');
}
function getP(o, p) { return String(p).split('.').reduce((a, k) => a == null ? a : a[k], o); }
function setP(o, p, v) { const ks = String(p).split('.'); const u = ks.pop(); const t = ks.reduce((a, k) => a[k], o); t[u] = v; }
// largura/altura explícitas: sem elas o gerador de PDF (html2canvas) desenha o SVG cortado
const svgUrl = svg => 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(/<svg[^>]*\swidth=/.test(svg) ? svg : svg.replace('<svg ', '<svg width="300" height="288" '));
function imgDoc(chave) {
  const im = DOCIMG.imagens[chave];
  if (im) return im;
  return chave === 'logo' ? LOGO_PADRAO : svgUrl(ICONES_PT[chave.replace(/^ic_/, '')] || '');
}
const fmtDataHora = v => { if (!v) return ''; const d = new Date(v); return isNaN(d) ? String(v) : d.toLocaleString('pt-BR', { timeZone: 'America/Sao_Paulo', day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit', second: '2-digit' }); };

// Assinantes que aparecem no papel (excluídos e invalidados ficam só no histórico).
function assinantesAtivos(R) { return (R.assin || []).filter(a => a.status !== 'Excluído' && a.status !== 'Invalidada').sort((a, b) => a.ordem - b.ordem); }
const nomeAss = a => a ? (a.status === 'Assinado' ? (a.nomeAssinado || a.nome) : a.nome) : '';
const docAss = a => a ? (a.status === 'Assinado' ? (a.docAssinado || a.documento) : a.documento) : '';
const imgAss = (a, h) => a && a.status === 'Assinado' && a.img ? `<img class="ass-img" src="${a.img}" style="max-height:${h}pt" alt="">` : '';

// ---------- o que o perfil Emissor pode preencher (o restante do papel é só do Administrador) ----------
// A mesma regra é conferida no servidor (Code.gs) ao salvar.
const CAMPOS_LIVRES = {
  PT: [/^(casa|cidade|data|de|ate|mao|nfunc|restrita|fds|obs|contratante|unidade|contratada|encarregados|local|descricao)$/,
       /^atividades\.\d+\.x$/, /^outra\.(x|t)$/, /^listas\.\d+\.itens\.\d+\.x$/],
  APR: [/^(campos|extras)\.\d+\.v$/, /^servico$/, /^grupos\.\d+\.medidas\.\d+\.(cond|obs)$/, /^fecho\.(segura|obs|pode)$/]
};
// Itens em branco e "Outros:" das listas da PT são para escrever; ao serem preenchidos ficam marcados como livres.
const itemLivre = it => !!it && (it.livre === true || !String(it.t || '').trim() || /^outros\b/i.test(String(it.t)));
function campoLivre(c, p) {
  if ((CAMPOS_LIVRES[c.tipo] || []).some(re => re.test(p))) return true;
  const m = /^listas\.(\d+)\.itens\.(\d+)\.(t|livre)$/.exec(p);
  return !!m && itemLivre((((c.listas || [])[m[1]] || {}).itens || [])[m[2]]);
}

// ---------- ajudantes de campo (editáveis no modo "editar") ----------
// R.restrito = true: só os campos de preenchimento ficam editáveis e a estrutura não pode ser alterada.
function criarRender(R) {
  const E = R.modo === 'editar';
  const c = R.c;
  const pode = p => E && (!R.restrito || campoLivre(c, p));
  const v = p => { const x = getP(c, p); return x == null ? '' : x; };
  const ed = (p, o = {}) => pode(p)
    ? `<span class="ed${o.cls ? ' ' + o.cls : ''}" contenteditable="${CE_MODO}" spellcheck="false" data-b="${p}"${o.sl ? ' data-sl="1"' : ''}${o.ph ? ` data-ph="${escD(o.ph)}"` : ''}>${fmt(v(p))}</span>`
    : `<span class="${o.cls || ''}">${fmt(v(p))}</span>`;
  const edb = (p, o = {}) => pode(p)
    ? `<div class="ed blk${o.cls ? ' ' + o.cls : ''}" contenteditable="${CE_MODO}" spellcheck="false" data-b="${p}" data-ml="1"${o.ph ? ` data-ph="${escD(o.ph)}"` : ''}>${fmtLinhas(v(p))}</div>`
    : `<div class="blk${o.cls ? ' ' + o.cls : ''}">${fmtLinhas(v(p))}</div>`;
  const caixa = (on, t) => { const [a, b] = t === '[' ? ['[', ']'] : ['(', ')']; return `${a}<span class="ckx">${on ? 'X' : '&nbsp;'}</span>${b}`; };
  const ck = (p, t = '(') => `<span class="ck${pode(p) ? ' clic' : ''}"${pode(p) ? ` data-x="${p}"` : ''}>${caixa(!!getP(c, p), t)}</span>`;
  const op = (p, val, t = '(') => `<span class="ck${pode(p) ? ' clic' : ''}"${pode(p) ? ` data-op="${p}" data-v="${escD(val)}"` : ''}>${caixa(getP(c, p) === val, t)}</span>`;
  return { E, estrutura: E && !R.restrito, c, v, ed, edb, ck, op, caixa };
}

const colgroup = ws => '<colgroup>' + ws.map(w => w == null ? '<col>' : `<col style="width:${w}pt">`).join('') + '</colgroup>';

// =============================== APR ===============================

function paginaAPR(r, primeira) {
  const el = document.createElement('div');
  el.className = 'pg pg-apr';
  const topo = primeira ? 125 : 110;
  el.innerHTML = `
  <div class="abs" style="left:26pt;top:18pt;width:546pt;height:92pt">${cabecalhoPaginaAPR(r)}</div>
  <div class="abs corpo" style="left:26pt;top:${topo}pt;width:542pt;height:${770 - topo}pt"></div>
  <div class="abs" style="left:38pt;top:777pt;width:531pt;height:38pt">${rodapeAPR(r)}</div>`;
  return el;
}

function cabecalhoPaginaAPR(r) {
  return `<table class="t cab" style="width:546pt;height:92pt">${colgroup([142, 241, 163])}
    <tr style="height:46pt"><td rowspan="2" class="cab-logo-apr"><img class="logo-apr" src="${imgDoc('logo')}" alt=""><div class="cal12 c emp">${r.ed('cab.empresa')}</div></td>
    <td rowspan="2" class="cal12 b c vm">${r.ed('cab.titulo')}</td>
    <td class="cal12 c vm lh19">DOCUMENTO<br>NÚMERO: ${r.ed('cab.documento', { sl: 1 })}</td></tr>
    <tr style="height:46pt"><td class="cal12 c vm lh19">REVISÃO<br>NÍVEL: ${r.ed('cab.revisao', { sl: 1 })}</td></tr></table>`;
}

function rodapeAPR(r) {
  return `<table class="t rod cal10" style="width:531pt;height:38pt">${colgroup([239, 207, 85])}
    <tr style="height:25pt"><td><b>PREPARADO POR</b>: ${r.ed('rod.preparado')}</td><td><b>APROVADO POR: ${r.ed('rod.aprovado')}</b></td>
    <td rowspan="2" class="pagcel"><b>PAG. NÚMERO:</b><b class="pagnum"></b></td></tr>
    <tr style="height:13pt"><td><b>DATA ORIGINAL DE LIBERAÇÃO:</b> ${r.ed('rod.liberacao', { sl: 1 })}</td><td><b>DATA ÚLTIMA REVISÃO:</b> ${r.ed('rod.revisao', { sl: 1 })}</td></tr></table>`;
}

function cabecalhoTabelaAPR(r) {
  const c = r.c, cs = c.campos || [];
  let h = `<tr style="height:26pt"><td colspan="6" class="ar14 b c vm">${r.ed('titulo')}</td></tr>`;
  h += `<tr style="height:20pt"><td colspan="4" class="cz ar12 b c vm">${r.ed('servicoRot')}</td>` +
    (cs[0] ? `<td class="cz ar12 b vm">${r.ed('campos.0.rot')}</td><td class="ar10 vm">${r.ed('campos.0.v', { sl: 1 })}</td>` : '<td colspan="2"></td>') + '</tr>';
  const resto = cs.slice(1);
  if (resto.length) {
    resto.forEach((f, i) => {
      h += `<tr style="height:${i === 0 ? 34 : 20}pt">` +
        (i === 0 ? `<td colspan="4" rowspan="${resto.length}" class="ar10 servico">${r.edb('servico', { ph: 'Descreva o serviço a ser executado' })}</td>` : '') +
        `<td class="cz ar12 b vm">${r.ed(`campos.${i + 1}.rot`)}</td><td class="ar10 vm">${r.ed(`campos.${i + 1}.v`, { sl: 1 })}</td></tr>`;
    });
  } else {
    h += `<tr style="height:34pt"><td colspan="6" class="ar10 servico">${r.edb('servico', { ph: 'Descreva o serviço a ser executado' })}</td></tr>`;
  }
  (c.extras || []).forEach((f, i) => {
    h += `<tr style="height:20pt"><td colspan="3" class="cz2 ar12 b vm">${r.ed(`extras.${i}.rot`)}</td><td colspan="3" class="ar10 vm">${r.ed(`extras.${i}.v`, { sl: 1 })}</td></tr>`;
  });
  h += `<tr class="cz ar9 b c colhdr" style="height:27pt">${(c.colRot || []).map((t, i) => `<td class="vm">${r.ed('colRot.' + i)}</td>`).join('')}</tr>`;
  return h;
}

function barraGrupo(gi) {
  return `<span class="tb no-print"><button type="button" data-act="grp-up" data-g="${gi}" title="Mover grupo para cima">↑</button><button type="button" data-act="grp-down" data-g="${gi}" title="Mover grupo para baixo">↓</button><button type="button" data-act="grp-add" data-g="${gi}" title="Novo grupo (ordem) abaixo">＋G</button><button type="button" data-act="grp-del" data-g="${gi}" title="Excluir grupo">✕</button></span>`;
}
function barraMedida(gi, mi) {
  return `<span class="tb no-print"><button type="button" data-act="med-up" data-g="${gi}" data-m="${mi}" title="Mover para cima">↑</button><button type="button" data-act="med-down" data-g="${gi}" data-m="${mi}" title="Mover para baixo">↓</button><button type="button" data-act="med-add" data-g="${gi}" data-m="${mi}" title="Nova medida abaixo">＋</button><button type="button" data-act="med-del" data-g="${gi}" data-m="${mi}" title="Excluir medida">✕</button></span>`;
}

function linhaMedida(r, gi, mi, novoSeg, mostra) {
  const p = `grupos.${gi}`, pm = `${p}.medidas.${mi}`;
  let h = `<tr data-g="${gi}" data-m="${mi}" style="height:22pt">`;
  if (novoSeg) {
    h += mostra
      ? `<td class="gcel ar8 b c vm ord">${r.ed(p + '.ordem', { sl: 1 })}${r.estrutura ? barraGrupo(gi) : ''}</td><td class="gcel ar8 b vm">${r.edb(p + '.atividade')}</td><td class="gcel ar8 b vm per">${r.edb(p + '.perigos')}</td>`
      : '<td class="gcel"></td><td class="gcel"></td><td class="gcel"></td>';
  }
  h += `<td class="ar8 b med vm">${r.edb(pm + '.texto')}${r.estrutura ? barraMedida(gi, mi) : ''}</td>`;
  h += `<td class="ar7 b c vm cond">${r.op(pm + '.cond', 'S', '[')} Sim ${r.op(pm + '.cond', 'N', '[')} Não</td>`;
  h += `<td class="cz ar65 b vm obs">${r.edb(pm + '.obs')}</td></tr>`;
  return h;
}

function paginasAPR(R, host) {
  const r = criarRender(R), c = R.c;
  const pags = [];
  let corpo, tb, seg;
  const nova = () => {
    const pg = paginaAPR(r, pags.length === 0);
    host.appendChild(pg); pags.push(pg);
    corpo = pg.querySelector('.corpo'); tb = null; seg = null;
  };
  const tabela = (ws, cls) => {
    const t = document.createElement('table');
    t.className = 't ' + cls; t.style.width = '542pt';
    t.innerHTML = colgroup(ws) + '<tbody></tbody>';
    corpo.appendChild(t);
    return t.tBodies[0];
  };
  const estoura = () => corpo.scrollHeight > corpo.clientHeight + 1;
  const sozinha = corpoAlvo => corpo.children.length === 1 && corpoAlvo.rows.length <= 1;

  nova();
  tb = tabela(c.cols, 'tab-apr');
  tb.insertAdjacentHTML('beforeend', cabecalhoTabelaAPR(r));
  const colocado = {};
  (c.grupos || []).forEach((g, gi) => (g.medidas || []).forEach((m, mi) => {
    for (let tent = 0; tent < 3; tent++) {
      if (!tb) tb = tabela(c.cols, 'tab-apr');
      const novoSeg = !seg || seg.gi !== gi;
      const mostra = novoSeg && !colocado[gi];
      tb.insertAdjacentHTML('beforeend', linhaMedida(r, gi, mi, novoSeg, mostra));
      const row = tb.lastElementChild;
      if (novoSeg) seg = { gi, cels: [...row.querySelectorAll('.gcel')], n: 1 };
      else { seg.n++; seg.cels.forEach(td => { td.rowSpan = seg.n; }); }
      if (!estoura() || sozinha(tb)) { if (mostra) colocado[gi] = true; break; }
      row.remove();
      if (novoSeg) seg = null; else { seg.n--; seg.cels.forEach(td => { td.rowSpan = seg.n; }); }
      nova();
    }
  }));

  // Fechamento: área segura, observações, serviço pode ser executado
  const f = c.fecho || {};
  const fechos = [
    `<tr style="height:19pt"><td colspan="6" class="cz ar9 b vm fecho">${r.ed('fecho.seguraRot')} ${r.op('fecho.segura', 'S', '[')} Sim &nbsp; ${r.op('fecho.segura', 'N', '[')} Não</td></tr>`,
    `<tr style="height:102pt"><td colspan="6" class="obsg"><div class="ar12 b">${r.ed('fecho.obsRot')}</div>${r.edb('fecho.obs', { cls: 'ar10' })}</td></tr>`,
    `<tr style="height:19pt"><td colspan="6" class="cz ar9 b vm fecho">${r.ed('fecho.podeRot')} ${r.op('fecho.pode', 'S', '[')} Sim &nbsp; ${r.op('fecho.pode', 'N', '[')} Não</td></tr>`
  ];
  if (f.seguraRot === undefined) fechos.length = 0;
  fechos.forEach(h => {
    for (let tent = 0; tent < 3; tent++) {
      if (!tb) tb = tabela(c.cols, 'tab-apr');
      tb.insertAdjacentHTML('beforeend', h);
      const row = tb.lastElementChild;
      if (!estoura() || sozinha(tb)) break;
      row.remove(); nova();
    }
  });

  // Quadro de nomes e assinaturas (duas pessoas por linha)
  const partes = assinantesAtivos(R);
  const linhas = Math.max(+c.assinLinhas || 0, Math.ceil(partes.length / 2));
  const larg = [69, 212, 127, 134];
  const cab = `<tr style="height:20pt" class="ar12 b c">${[0, 1, 0, 1].map(i => `<td class="vm">${r.ed('assinRot.' + i)}</td>`).join('')}</tr>`;
  const altLin = +c.assinAltura || 20;
  const cel = a => `<td class="ar7 b vm nomeass">${escD(nomeAss(a))}</td><td class="c vm celass">${imgAss(a, altLin - 2)}</td>`;
  const linha = i => `<tr style="height:${altLin}pt">${cel(partes[2 * i])}${cel(partes[2 * i + 1])}</tr>`;
  let st = null;
  for (let i = 0; i < linhas; i++) {
    for (let tent = 0; tent < 3; tent++) {
      const nova_ = !st;
      if (nova_) st = tabela(larg, 'tab-ass');
      st.insertAdjacentHTML('beforeend', (nova_ ? cab : '') + linha(i));
      if (!estoura() || (corpo.children.length === 1 && st.rows.length <= 2)) break;
      if (nova_) { st.parentNode.remove(); } else st.lastElementChild.remove();
      nova(); st = null;
    }
  }
  return pags;
}

let fontesProntas = null;
function aguardarFontes() {
  if (!fontesProntas) {
    fontesProntas = (document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve())
      .then(() => Promise.all(['Arimo', 'Carlito', 'Tinos'].map(f => document.fonts && document.fonts.load ? document.fonts.load(`bold 10pt "${f}"`).catch(() => {}) : null)))
      .catch(() => {});
  }
  return fontesProntas;
}

// Monta as páginas do documento dentro de `host`.
// R = { modo: 'editar' | 'ver', c: conteúdo, assin: assinantes, meta: dados do documento, certificado: bool }
// A paginação é feita fora da tela (mesmas fontes e medidas) e depois as folhas são movidas para o host.
async function montarDocumento(host, R) {
  await aguardarFontes();
  let medidor = document.getElementById('medidor-doc');
  if (!medidor) {
    medidor = document.createElement('div');
    medidor.id = 'medidor-doc';
    medidor.className = 'papel';
    document.body.appendChild(medidor);
  }
  medidor.innerHTML = '';
  const pags = R.c.tipo === 'PT' ? paginasPT(R, medidor) : paginasAPR(R, medidor);
  if (R.certificado) pags.push(...paginaCertificado(R, medidor));
  pags.forEach((p, i) => {
    p.dataset.pag = i + 1;
    p.querySelectorAll('.pagnum').forEach(e => { e.textContent = R.c.tipo === 'PT' ? `${i + 1}/${pags.length}` : `${i + 1} / ${pags.length}`; });
  });
  host.innerHTML = '';
  pags.forEach(p => host.appendChild(p));
  medidor.innerHTML = '';
  return pags;
}

// ========================== EDIÇÃO NO PAPEL ==========================

function lerEd(el) {
  let t = (el.innerText || '').replace(/​/g, '').replace(/\r/g, '');
  if (el.dataset.sl) t = t.replace(/\s*\n\s{0,}/g, ' ');
  return t.replace(/\n$/, '');
}

function proximoNumero(txt) {
  const m = /^(\d+)\.(\d+)\.(\d+)/.exec(String(txt || ''));
  return m ? `${m[1]}.${m[2]}.${+m[3] + 1} - ` : '';
}

// Liga a edição de um host montado em modo "editar".
// aoMudar(layout) é chamado a cada alteração (layout=true quando a altura do texto pode ter mudado);
// aoEstrutura() quando linhas/grupos foram incluídos, movidos ou excluídos.
// registrar(antes) recebe o conteúdo (JSON) anterior a cada alteração concluída — base do Desfazer.
function ligarEdicao(host, R, aoMudar, aoEstrutura, registrar) {
  let antesDoCampo = null;
  const reg = antes => { if (registrar && antes !== JSON.stringify(R.c)) registrar(antes); };
  const atualizarIrmaos = (el, v) => {
    host.querySelectorAll(`[data-b="${el.dataset.b}"]`).forEach(o => { if (o !== el) o.innerHTML = o.dataset.ml ? fmtLinhas(v) : fmt(v); });
  };
  host.addEventListener('focusin', e => {
    const el = e.target.closest && e.target.closest('.ed');
    if (!el || el.classList.contains('editando')) return;
    el.classList.add('editando');
    antesDoCampo = JSON.stringify(R.c);
    const v = getP(R.c, el.dataset.b);
    el.textContent = v == null ? '' : v;
  });
  host.addEventListener('focusout', e => {
    const el = e.target.closest && e.target.closest('.ed');
    if (!el) return;
    el.classList.remove('editando');
    const v = lerEd(el);
    setP(R.c, el.dataset.b, v);
    const item = /^(listas\.\d+\.itens\.\d+)\.t$/.exec(el.dataset.b);
    if (item && R.restrito && v.trim()) getP(R.c, item[1]).livre = true;   // item em branco preenchido continua editável
    el.innerHTML = el.dataset.ml ? fmtLinhas(v) : fmt(v);
    atualizarIrmaos(el, v);
    if (antesDoCampo) { reg(antesDoCampo); antesDoCampo = null; }
    aoMudar(true);
  });
  host.addEventListener('input', e => {
    const el = e.target.closest && e.target.closest('.ed');
    if (!el) return;
    const v = lerEd(el);
    setP(R.c, el.dataset.b, v);
    atualizarIrmaos(el, v);
    aoMudar(false);
  });
  host.addEventListener('keydown', e => {
    const el = e.target.closest && e.target.closest('.ed');
    if (el && el.dataset.sl && e.key === 'Enter') { e.preventDefault(); el.blur(); }
  });
  host.addEventListener('paste', e => {
    const el = e.target.closest && e.target.closest('.ed');
    if (!el) return;
    e.preventDefault();
    let t = (e.clipboardData || window.clipboardData).getData('text/plain') || '';
    if (el.dataset.sl) t = t.replace(/\s*\n\s{0,}/g, ' ');
    document.execCommand('insertText', false, t);
  });
  host.addEventListener('click', e => {
    const x = e.target.closest('[data-x]');
    if (x) {
      const antes = JSON.stringify(R.c);
      const v = !getP(R.c, x.dataset.x);
      setP(R.c, x.dataset.x, v);
      host.querySelectorAll(`[data-x="${x.dataset.x}"] .ckx`).forEach(k => { k.innerHTML = v ? 'X' : '&nbsp;'; });
      reg(antes);
      aoMudar(false);
      return;
    }
    const o = e.target.closest('[data-op]');
    if (o) {
      const antes = JSON.stringify(R.c);
      const p = o.dataset.op, atual = getP(R.c, p), v = atual === o.dataset.v ? '' : o.dataset.v;
      setP(R.c, p, v);
      host.querySelectorAll(`[data-op="${p}"]`).forEach(k => { k.querySelector('.ckx').innerHTML = k.dataset.v === v ? 'X' : '&nbsp;'; });
      reg(antes);
      aoMudar(false);
      return;
    }
    const b = e.target.closest('[data-act]');
    if (!b || R.restrito) return;
    e.preventDefault();
    const antes = JSON.stringify(R.c);
    const gs = R.c.grupos, gi = +b.dataset.g, mi = +b.dataset.m, g = gs[gi];
    const troca = (arr, i, j) => { if (j < 0 || j >= arr.length) return false; [arr[i], arr[j]] = [arr[j], arr[i]]; return true; };
    switch (b.dataset.act) {
      case 'med-add': g.medidas.splice(mi + 1, 0, { texto: proximoNumero(g.medidas[mi].texto), cond: '', obs: '' }); break;
      case 'med-del':
        if (g.medidas.length === 1) { if (!confirm('Esta é a única medida do grupo. Excluir o grupo inteiro?')) return; gs.splice(gi, 1); }
        else { if (!confirm('Excluir esta medida de controle?')) return; g.medidas.splice(mi, 1); }
        break;
      case 'med-up': if (!troca(g.medidas, mi, mi - 1)) return; break;
      case 'med-down': if (!troca(g.medidas, mi, mi + 1)) return; break;
      case 'grp-add': gs.splice(gi + 1, 0, { ordem: String(gs.length + 1), atividade: '', perigos: '', medidas: [{ texto: `${gs.length + 1}.0.0 - `, cond: '', obs: '' }] }); break;
      case 'grp-del': if (gs.length === 1 || !confirm('Excluir o grupo inteiro (atividade, perigos e todas as medidas)?')) return; gs.splice(gi, 1); break;
      case 'grp-up': if (!troca(gs, gi, gi - 1)) return; break;
      case 'grp-down': if (!troca(gs, gi, gi + 1)) return; break;
      default: return;
    }

function sessaoExpirada() {

    try {
      const u = await api('alterarSenha', { atual: $('#t-atual').value, nova });
      S.usuario = { email: u.email, nome: u.nome, perfil: u.perfil, trocar: false };
      S.senhaLogin = null;
      sessao(true);
      await carregar();
      mostrarApp();
      toast('Senha definida. Bem-vindo(a)!');
    } catch (err) { falha(err); }
  };
  setTimeout(() => { const f = $(atual ? '#t-nova' : '#t-atual'); f && f.focus(); }, 50);
}

// ============================== CASCA DO APP ==============================

function irPara(t) {
  if (S.ed && S.ed.sujo && !confirm('Há alterações não salvas. Sair do editor mesmo assim?')) return;
  S.ed = null; S.tela = t;
  document.body.classList.remove('com-editor');
  $$('#nav [data-tela]').forEach(b => b.classList.toggle('ativo', b.dataset.tela === t));
  if (t === 'modelos') telaModelos(); else if (t === 'config') telaConfig(); else if (t === 'voluntarios') telaVoluntarios().catch(falha); else telaDocs();
  window.scrollTo(0, 0);
}

// ============================== DOCUMENTOS ==============================
function telaDocs() {
  const f = S.f;
  const cont = {}; STATUS.forEach(s => { cont[s] = 0; });
  S.docs.forEach(d => { cont[d.status] = (cont[d.status] || 0) + 1; });
  const aprsDe = {}; S.docs.forEach(d => { if (d.tipo === 'APR' && d.vinculo && d.status !== 'Cancelado') (aprsDe[d.vinculo] = aprsDe[d.vinculo] || []).push(d.id); });
  const lista = S.docs.filter(d => (!f.tipo || d.tipo === f.tipo) && (!f.status || d.status === f.status) &&
    (!f.busca || norm([d.id, d.titulo, d.casa, d.cidade, d.resp, d.codigo].join(' ')).includes(norm(f.busca))))
    .sort((a, b) => String(b.criado).localeCompare(String(a.criado)));
  $('#conteudo').innerHTML = `
  <section class="pagina">
    <div class="pg-topo">
      <div><h2>Documentos emitidos</h2><p class="muted">PTs e APRs, situação das assinaturas e impressão.</p></div>
      <div class="acoes"><button class="btn btn-primary" id="b-nova-pt">${ic('plus')} Nova PT</button><button class="btn btn-primary" id="b-nova-apr">${ic('plus')} Nova APR</button></div>
    </div>
    <div class="chips">
      <button class="chip ${!f.status ? 'ativo' : ''}" data-st="">Todos <b>${S.docs.length}</b></button>
      ${STATUS.map(s => `<button class="chip ${f.status === s ? 'ativo' : ''}" data-st="${s}">${s} <b>${cont[s] || 0}</b></button>`).join('')}
    </div>
    <div class="filtros">
      <label class="busca">${ic('search')}<input id="f-busca" placeholder="Buscar por número, casa de oração, título, responsável…" value="${esc(f.busca)}"></label>
      <select id="f-tipo">${opcoes([['PT', 'PT – Permissão de Trabalho'], ['APR', 'APR – Análise Preliminar de Risco']], f.tipo, 'Todos os tipos')}</select>
    </div>
    ${lista.length ? `
    <div class="tabela-wrap"><table class="tab tab-livre tab-cartoes tab-docs">
      <thead><tr><th>Número</th><th>Documento</th><th>Casa de oração</th><th>Data</th><th>Assinaturas</th><th>Situação</th><th></th></tr></thead>
      <tbody>${lista.map(d => `<tr data-id="${esc(d.id)}" class="clicavel">
        <td><b>${esc(d.id)}</b><div class="muted sm">${esc(d.codigo || '')}</div></td>
        <td>${esc(d.titulo)}${d.vinculo ? `<div class="muted sm">vinculada a ${esc(d.vinculo)}</div>` : ''}${d.tipo === 'PT' && aprsDe[d.id] ? `<div class="muted sm">APR vinculada: ${aprsDe[d.id].map(esc).join(', ')}</div>` : ''}</td>
        <td data-l="Casa">${esc(d.casa || '—')}${d.cidade ? `<div class="muted sm">${esc(d.cidade)}</div>` : ''}</td>
        <td data-l="Data">${esc(d.data || '—')}</td>
        <td data-l="Assinaturas">${d.total ? `<div class="prog"><i style="width:${Math.round(100 * d.assinados / d.total)}%"></i></div><span class="sm">${d.assinados}/${d.total}</span>` : '<span class="muted sm">—</span>'}</td>
        <td data-l="Situação">${bdg(d.status)}</td>
        <td class="dir"><button class="btn-icon" data-imp="${esc(d.id)}" title="Imprimir">${ic('print')}</button>${podeAdmin() ? `<button class="btn-icon" data-del="${esc(d.id)}" title="Excluir documento" aria-label="Excluir documento ${esc(d.id)}">${ic('trash')}</button>` : ''}</td></tr>`).join('')}</tbody>
    </table></div>` : `<div class="vazio">${ic('doc')}<p>${S.docs.length ? 'Nenhum documento com esses filtros.' : 'Nenhum documento emitido ainda. Comece por <b>Nova PT</b> ou <b>Nova APR</b>.'}</p></div>`}
  </section>`;
  $('#b-nova-pt').onclick = () => novaPT().catch(falha);
  $('#b-nova-apr').onclick = () => escolherModeloAPR();
  $$('.chip[data-st]').forEach(b => b.onclick = () => { S.f.status = b.dataset.st; telaDocs(); });
  $('#f-tipo').onchange = e => { S.f.tipo = e.target.value; telaDocs(); };
  let t; $('#f-busca').oninput = e => { clearTimeout(t); t = setTimeout(() => { S.f.busca = e.target.value; telaDocs(); const i = $('#f-busca'); i.focus(); i.setSelectionRange(i.value.length, i.value.length); }, 250); };
  $$('tr[data-id]').forEach(tr => tr.onclick = e => { if (e.target.closest('[data-imp],[data-del]')) return; abrirDoc(tr.dataset.id).catch(falha); });
  $$('[data-del]').forEach(b => b.onclick = () => excluirDoc(b.dataset.del).catch(falha));
  $$('[data-imp]').forEach(b => b.onclick = async () => {
    try { const d = await api('documento', { id: b.dataset.imp }); await imprimir({ c: d.conteudo, assin: d.assinantes, meta: d.doc }, true); } catch (e) { falha(e); }
  });
}

// Exclui da lista (o registro continua na planilha, com a situação "Excluído" e o motivo no histórico).
async function excluirDoc(id) {
  const d = S.docs.filter(x => x.id === id)[0] || { id };
  const motivo = await pedirTexto('Excluir documento ' + id,
    `Motivo da exclusão de ${d.titulo ? d.titulo + ' (' + id + ')' : id}. O documento sai da lista e os links de assinatura deixam de funcionar; o registro continua na planilha como "Excluído".`, 'Excluir');
  if (!motivo) return;
  await api('cancelarDocumento', { id, motivo, excluir: true });
  await carregar();
  telaDocs();
  toast('Documento ' + id + ' excluído da lista.');
}

async function abrirDoc(id) {
  const d = await api('documento', { id });
  abrirEditor({ tipo: 'doc', id: d.doc.id, c: d.conteudo, assin: d.assinantes, meta: d.doc });
}

function modelosAtivos(tipo) { return S.modelos.filter(m => m.tipo === tipo && m.ativo).sort((a, b) => a.ordem - b.ordem || String(a.codigo).localeCompare(String(b.codigo))); }

async function novaPT(vinculo) {
  const ms = modelosAtivos('PT');
  if (!ms.length) { toast('Nenhum modelo de PT ativo. Verifique a tela Modelos.', 'erro'); return; }
  const m = await api('modelo', { id: ms[0].id });
  const c = clone(m.conteudo);
  if (!c.data) c.data = hojeBR();
  abrirEditor({ tipo: 'doc', id: null, c, assin: [], meta: { status: 'Rascunho', modeloId: m.id, vinculo: vinculo || '' } });
}

function escolherModeloAPR(vinculo) {
  const ms = modelosAtivos('APR');
  abrirModal({
    titulo: 'Nova APR — escolha o modelo', largura: '640px',
    corpo: `<label class="busca">${ic('search')}<input id="m-busca" placeholder="Filtrar modelos…" autofocus></label>
      <div class="lista-mod" id="m-lista">${ms.map(m => `<button type="button" class="item-mod" data-id="${esc(m.id)}" data-q="${esc(norm(m.codigo + ' ' + m.nome + ' ' + m.titulo))}">
        <b>${esc(m.codigo)}</b><span>${esc(m.titulo || m.nome)}</span></button>`).join('') || '<p class="muted">Nenhum modelo de APR ativo.</p>'}</div>`
  });
  $('#m-busca').oninput = e => { const q = norm(e.target.value); $$('#m-lista .item-mod').forEach(b => { b.hidden = q && !b.dataset.q.includes(q); }); };
  $$('#m-lista .item-mod').forEach(b => b.onclick = async () => {
    fecharModal();
    try {
      const m = await api('modelo', { id: b.dataset.id });
      const c = clone(m.conteudo);
      const campo = k => (c.campos || []).concat(c.extras || []).filter(f => f.k === k)[0];
      if (campo('data') && !campo('data').v) campo('data').v = hojeBR();
      if (vinculo) {
        if (campo('casa')) campo('casa').v = vinculo.casa || '';
        if (campo('data')) campo('data').v = vinculo.data || campo('data').v;
        if (campo('resp')) campo('resp').v = vinculo.resp || '';
        c.servico = vinculo.servico || '';
      }
      abrirEditor({ tipo: 'doc', id: null, c, assin: [], meta: { status: 'Rascunho', modeloId: m.id, vinculo: vinculo ? vinculo.id : '' } });
    } catch (err) { falha(err); }
  });
}

// ============================== EDITOR ==============================
function abrirEditor(ed) {
  ed.sujo = !ed.id;
  ed.painel = ed.painel || (ed.tipo === 'doc' ? 'assin' : 'props');
  ed.hist = []; ed.refazer = [];
  ed.R = { modo: 'editar', c: ed.c, assin: ed.assin, meta: ed.meta, restrito: !podeAdmin() };
  S.ed = ed; S.tela = 'editor';
  document.body.classList.add('com-editor');
  $$('#nav [data-tela]').forEach(b => b.classList.toggle('ativo', b.dataset.tela === (ed.tipo === 'doc' ? 'docs' : 'modelos')));
  $('#conteudo').innerHTML = `
  <section class="editor">
    <div class="ed-barra" id="ed-barra"></div>
    <div class="ed-corpo">
      <div class="ed-area" id="ed-area"><div class="papel modo-editar" id="papel"></div></div>
      <aside class="ed-painel" id="ed-painel"></aside>
    </div>
  </section>`;
  const host = $('#papel');
  let tRep = null;
  const repaginar = () => { clearTimeout(tRep); tRep = setTimeout(() => {
    const a = document.activeElement;
    if (a && a.closest && a.closest('#papel .ed')) return;   // ainda editando: repagina quando sair do campo
    redesenhar();
  }, 180); };
  ligarEdicao(host, ed.R, layout => { marcarSujo(); if (layout) repaginar(); }, () => { marcarSujo(); redesenhar(); }, registrarHist);
  barraEditor();
  painelEditor();
  redesenhar().then(() => { if (S.zoom === 'fit') aplicarZoom(); });
}

function podeEditarDoc(ed) { return ed.tipo === 'modelo' ? podeAdmin() : ed.meta.status !== 'Cancelado'; }

// ---------- desfazer / refazer (histórico do conteúdo em edição) ----------
function registrarHist(antes) {
  const ed = S.ed; if (!ed) return;
  ed.hist.push(antes);
  if (ed.hist.length > 80) ed.hist.shift();
  ed.refazer = [];
  botoesHist();
}
function botoesHist() {
  const ed = S.ed; if (!ed) return;
  const d = $('#b-desfazer'), r = $('#b-refazer');
  if (d) { d.disabled = !ed.hist.length; d.title = ed.hist.length ? `Desfazer (Ctrl+Z) — ${ed.hist.length} alteração(ões)` : 'Nada para desfazer'; }
  if (r) { r.disabled = !ed.refazer.length; r.title = ed.refazer.length ? 'Refazer (Ctrl+Y)' : 'Nada para refazer'; }
}
function voltarHist(de, para) {
  const ed = S.ed; if (!ed) return;
  const a = document.activeElement; if (a && a.closest && a.closest('#papel .ed')) a.blur();   // grava o campo aberto antes
  if (!ed[de].length) return;
  ed[para].push(JSON.stringify(ed.c));
  ed.c = JSON.parse(ed[de].pop());
  ed.R.c = ed.c;
  marcarSujo(); botoesHist();
  if (ed.painel === 'props') painelEditor();
  redesenhar();
}
const desfazer = () => voltarHist('hist', 'refazer');
const refazer = () => voltarHist('refazer', 'hist');

async function redesenhar() {
  const ed = S.ed; if (!ed) return;
  const area = $('#ed-area'), topo = area.scrollTop;
  ed.R.modo = podeEditarDoc(ed) ? 'editar' : 'ver';
  ed.R.c = ed.c; ed.R.assin = ed.assin; ed.R.meta = ed.meta; ed.R.restrito = !podeAdmin();
  $('#papel').classList.toggle('modo-editar', ed.R.modo === 'editar');
  await montarDocumento($('#papel'), ed.R);
  aplicarZoom();
  area.scrollTop = topo;
}

function marcarSujo() { if (!S.ed) return; S.ed.sujo = true; const b = $('#b-salvar'); if (b) b.classList.add('pulsa'); }

function tituloEditor(ed) {
  if (ed.tipo === 'modelo') return `Modelo · ${esc(ed.c.cab.documento || '')} <small>${esc(ed.c.nome || '')}</small>`;
  return `${ed.id ? esc(ed.id) : 'Novo documento'} <small>${esc(ed.c.titulo || ed.c.cab.titulo)}</small>`;
}

// Resumo do vínculo PT ↔ APR para o cabeçalho do editor.
function infoVinculo(ed) {
  if (ed.c.tipo === 'APR') return ed.meta.vinculo ? `<span class="bdg b-mute" title="PT vinculada">${ic('link')} ${esc(ed.meta.vinculo)}</span>` : '';
  const aprs = S.docs.filter(d => d.tipo === 'APR' && d.vinculo === ed.id && d.status !== 'Cancelado');
  return aprs.length ? `<span class="bdg b-mute" title="APRs vinculadas">${ic('link')} ${aprs.map(d => esc(d.id)).join(', ')}</span>` : '';
}

// Escolhe um documento já emitido do tipo oposto e grava o vínculo (APR guarda o número da PT).
async function vincularExistente(ehPT) {
  const ed = S.ed;
  if (ed.sujo) { toast('Salve o documento antes de vincular.', 'aviso'); return; }
  const tipo = ehPT ? 'APR' : 'PT';
  const cand = S.docs.filter(d => d.tipo === tipo && d.id !== ed.id && d.status !== 'Cancelado').sort((a, b) => String(b.criado).localeCompare(String(a.criado)));
  if (!cand.length) { toast(`Não há ${tipo} emitida disponível para vincular.`, 'aviso'); return; }
  const id = await new Promise(res => {
    abrirModal({
      titulo: ehPT ? 'Vincular APR já emitida a esta PT' : 'Vincular esta APR a uma PT já emitida', largura: '640px', aoFechar: () => res(null),
      corpo: `<label class="busca">${ic('search')}<input id="v-busca-doc" placeholder="Filtrar por número, título, casa de oração…" autofocus></label>
        <div class="lista-mod" id="v-lista-doc">${cand.map(d => `<button type="button" class="item-mod" data-id="${esc(d.id)}" data-q="${esc(norm([d.id, d.titulo, d.casa, d.data, d.vinculo].join(' ')))}">
          <b>${esc(d.id)}</b><span>${esc(d.titulo)}${d.casa ? ' · ' + esc(d.casa) : ''}${d.data ? ' · ' + esc(d.data) : ''}${d.vinculo ? ` · já vinculada a ${esc(d.vinculo)}` : ''}</span></button>`).join('')}</div>`,
      acoes: [{ label: 'Voltar' }]
    });
    $('#v-busca-doc').oninput = e => { const q = norm(e.target.value); $$('#v-lista-doc .item-mod').forEach(b => { b.hidden = q && !b.dataset.q.includes(q); }); };
    $$('#v-lista-doc .item-mod').forEach(b => b.onclick = () => { $('#modal')._aoFechar = null; fecharModal(); res(b.dataset.id); });
  });
  if (!id) return;
  const outro = S.docs.filter(d => d.id === id)[0] || {};
  const apr = ehPT ? id : ed.id, pt = ehPT ? ed.id : id;
  const atual = ehPT ? outro.vinculo : ed.meta.vinculo;
  if (atual && atual !== pt && !(await confirmar('Trocar vínculo', `${apr} já está vinculada à ${atual}. Vincular à ${pt} em vez disso?`, 'Trocar'))) return;
  await api('vincularDocumento', { apr, pt });
  await carregar(); await abrirDoc(ed.id);
  toast(`${apr} vinculada à ${pt}.`);
}

function barraEditor() {
  const ed = S.ed;
  const doc = ed.tipo === 'doc';
  $('#ed-barra').innerHTML = `
    <button class="btn-icon" id="b-voltar" title="Voltar">${ic('back')}</button>
    <div class="ed-titulo">${tituloEditor(ed)} ${doc ? bdg(ed.meta.status || 'Rascunho') : (ed.ativo === false ? bdg('Inativo') : '')} ${doc && ed.id ? infoVinculo(ed) : ''}</div>
    <div class="ed-acoes">
      <div class="zoom"><button class="btn-icon" id="z-menos" title="Diminuir">${ic('zout')}</button><button class="btn-icon" id="z-fit" title="Ajustar à largura">${ic('fit')}</button><button class="btn-icon" id="z-mais" title="Aumentar">${ic('zin')}</button></div>
      ${podeEditarDoc(ed) ? `<div class="zoom"><button class="btn-icon" id="b-desfazer">${ic('undo')}</button><button class="btn-icon" id="b-refazer">${ic('redo')}</button></div>
      <button class="btn btn-primary ${ed.sujo ? 'pulsa' : ''}" id="b-salvar">${ic('save')} <span>Salvar</span></button>` : ''}
      <button class="btn" id="b-imprimir">${ic('print')} <span>Imprimir</span></button>
      <button class="btn" id="b-pdf">${ic('pdf')} <span>PDF</span></button>
      <button class="btn" id="b-painel" title="Painel lateral">${ic('panel')} <span>${doc ? 'Assinaturas' : 'Propriedades'}</span></button>
      ${doc && ed.id ? `<div class="menu"><button class="btn-icon" id="b-mais" title="Mais ações">⋮</button><div class="menu-lista" id="menu-mais" hidden>
        ${ed.c.tipo === 'PT' ? `<button data-m="apr">${ic('plus')} Emitir APR vinculada a esta PT</button>
        <button data-m="vincAPR">${ic('link')} Vincular APR já emitida…</button>` : `<button data-m="vincPT">${ic('link')} Vincular a uma PT já emitida…</button>
        ${ed.meta.vinculo ? `<button data-m="desvincular">${ic('x')} Desvincular da ${esc(ed.meta.vinculo)}</button>` : ''}`}
        <button data-m="dup">${ic('copy')} Duplicar documento</button>
        ${podeAdmin() && ed.meta.status !== 'Cancelado' ? `<button data-m="cancelar" class="perigo">${ic('ban')} Cancelar documento</button>` : ''}
        ${podeAdmin() ? `<button data-m="excluir" class="perigo">${ic('trash')} Excluir da lista</button>` : ''}</div></div>` : ''}
      ${!doc && podeAdmin() ? `<div class="menu"><button class="btn-icon" id="b-mais" title="Mais ações">⋮</button><div class="menu-lista" id="menu-mais" hidden>
        <button data-m="emitir">${ic('plus')} Emitir documento com este modelo</button>
        ${ed.id && ed.padrao ? `<button data-m="restaurar">${ic('refresh')} Restaurar conteúdo original</button>` : ''}</div></div>` : ''}
    </div>`;
  $('#b-voltar').onclick = () => irPara(ed.tipo === 'doc' ? 'docs' : 'modelos');
  $('#z-menos').onclick = () => mudarZoom(-0.1);
  $('#z-mais').onclick = () => mudarZoom(0.1);
  $('#z-fit').onclick = () => { S.zoom = 'fit'; aplicarZoom(); };
  if ($('#b-salvar')) $('#b-salvar').onclick = () => salvarEditor().catch(falha);
  if ($('#b-desfazer')) { $('#b-desfazer').onclick = desfazer; $('#b-refazer').onclick = refazer; botoesHist(); }
  $('#b-imprimir').onclick = () => imprimir({ c: ed.c, assin: ed.assin, meta: Object.assign({}, ed.meta, { id: ed.id }) }).catch(falha);
  $('#b-pdf').onclick = () => dialogoPdf().catch(falha);
  $('#b-painel').onclick = () => document.body.classList.toggle('painel-aberto');
  const mais = $('#b-mais');
  if (mais) {
    mais.onclick = e => { e.stopPropagation(); $('#menu-mais').hidden = !$('#menu-mais').hidden; };
    document.addEventListener('click', () => { const m = $('#menu-mais'); if (m) m.hidden = true; }, { once: true });
    $$('#menu-mais [data-m]').forEach(b => b.onclick = () => acaoMenu(b.dataset.m).catch(falha));
  }
}

async function acaoMenu(m) {
  const ed = S.ed;
  $('#menu-mais').hidden = true;
  if (m === 'apr') {
    if (ed.sujo) { toast('Salve a PT antes de emitir a APR vinculada.', 'aviso'); return; }
    const c = ed.c;
    escolherModeloAPR({ id: ed.id, casa: [c.casa, c.cidade].filter(Boolean).join(' – '), data: c.data, resp: c.encarregados || c.contratada, servico: c.descricao });
  } else if (m === 'vincAPR' || m === 'vincPT') {
    await vincularExistente(m === 'vincAPR');
  } else if (m === 'desvincular') {
    if (ed.sujo) { toast('Salve o documento antes de desvincular.', 'aviso'); return; }
    if (!(await confirmar('Desvincular', `Remover o vínculo desta APR com a ${esc(ed.meta.vinculo)}?`, 'Desvincular'))) return;
    await api('vincularDocumento', { apr: ed.id, pt: '' });
    await carregar(); await abrirDoc(ed.id);
    toast('Vínculo removido.');
  } else if (m === 'dup') {
    const c = clone(ed.c);
    if (ed.c.tipo === 'PT') { (c.atividades || []).forEach(a => { a.x = false; }); }
    S.ed.sujo = false;
    abrirEditor({ tipo: 'doc', id: null, c, assin: [], meta: { status: 'Rascunho', modeloId: ed.meta.modeloId, vinculo: '', origem: ed.id } });
    toast('Cópia criada. Ajuste e salve para gerar um novo número.');
  } else if (m === 'cancelar' || m === 'excluir') {
    const motivo = await pedirTexto(m === 'cancelar' ? 'Cancelar documento' : 'Excluir da lista', m === 'cancelar'
      ? 'Motivo do cancelamento (o documento continua na planilha, marcado como cancelado; os links de assinatura param de funcionar).'
      : 'Motivo da exclusão (o registro continua na planilha com a situação "Excluído").', m === 'cancelar' ? 'Cancelar documento' : 'Excluir');
    if (!motivo) return;
    await api('cancelarDocumento', { id: ed.id, motivo, excluir: m === 'excluir' });
    await carregar();
    S.ed.sujo = false;
    if (m === 'excluir') { irPara('docs'); toast('Documento excluído da lista.'); return; }
    await abrirDoc(ed.id);
    toast('Documento cancelado.');
  } else if (m === 'emitir') {
    if (ed.sujo) { toast('Salve o modelo antes de emitir.', 'aviso'); return; }
    const c = clone(ed.c);
    const campo = k => (c.campos || []).concat(c.extras || []).filter(f => f.k === k)[0];
    if (c.tipo === 'PT') { if (!c.data) c.data = hojeBR(); } else if (campo('data') && !campo('data').v) campo('data').v = hojeBR();
    S.ed.sujo = false;
    abrirEditor({ tipo: 'doc', id: null, c, assin: [], meta: { status: 'Rascunho', modeloId: ed.id, vinculo: '' } });
  } else if (m === 'restaurar') {
    if (!await confirmar('Restaurar conteúdo original', 'O modelo volta a ter exatamente o conteúdo do documento original (PDF). Suas alterações neste modelo serão perdidas. Documentos já emitidos não são afetados.', 'Restaurar', 'btn-danger')) return;
    const r = await api('restaurarModelo', { id: ed.id });
    ed.c = r.conteudo; ed.sujo = false;
    await carregar();
    abrirEditor(Object.assign(ed, { c: r.conteudo }));
    S.ed.sujo = false; barraEditor();
    toast('Modelo restaurado.');
  }
}

function aplicarZoom() {
  const area = $('#ed-area'), papel = $('#papel');
  if (!area || !papel) return;
  let z = S.zoom;
  if (z === 'fit') z = Math.min(1.6, Math.max(0.3, (area.clientWidth - 32) / (595.3 * 96 / 72)));
  papel.style.zoom = z;
  papel.dataset.z = z;
}
function mudarZoom(d) {
  const atual = +($('#papel').dataset.z || 1);
  S.zoom = Math.min(2, Math.max(0.3, Math.round((atual + d) * 10) / 10));
  aplicarZoom();
}
window.addEventListener('resize', () => { if (S.zoom === 'fit') aplicarZoom(); if (S.pub) ajustarZoomPub(); });

async function salvarEditor(invalidar) {
  const ed = S.ed;
  const ativo = document.activeElement; if (ativo && ativo.blur) ativo.blur();
  if (ed.tipo === 'modelo') {
    const r = await api('salvarModelo', { id: ed.id, conteudo: ed.c }, { txt: 'Salvando modelo…' });
    ed.id = r.id; ed.c = r.conteudo; ed.R.c = ed.c; ed.sujo = false;
    await carregar();
    barraEditor(); painelEditor();
    toast('Modelo salvo.');
    return;
  }
  const r = await api('salvarDocumento', { id: ed.id, conteudo: ed.c, modeloId: ed.meta.modeloId, vinculo: ed.meta.vinculo, origem: ed.meta.origem, invalidar: !!invalidar }, { txt: 'Salvando…' });
  if (r.precisaConfirmar) {
    const ok = await confirmar('Documento já assinado', `Este documento já tem <b>${r.assinadas}</b> assinatura(s). Ao salvar a alteração, essas assinaturas ficam registradas como <b>invalidadas</b> e cada pessoa recebe um <b>novo link</b> para assinar a versão nova. Deseja continuar?`, 'Salvar e coletar novamente', 'btn-danger');
    if (ok) return salvarEditor(true);
    return;
  }
  ed.id = r.doc.id; ed.meta = r.doc; ed.assin = r.assinantes; ed.sujo = false;
  const i = S.docs.findIndex(d => d.id === r.doc.id);
  const resumo = Object.assign({}, r.doc, { total: ativosAssin(r.assinantes).length, assinados: ativosAssin(r.assinantes).filter(a => a.status === 'Assinado').length });
  if (i >= 0) S.docs[i] = resumo; else S.docs.unshift(resumo);
  barraEditor(); painelEditor();
  await redesenhar();
  toast(invalidar ? 'Salvo. Envie os novos links de assinatura.' : 'Documento salvo.');
}
const ativosAssin = l => (l || []).filter(a => a.status !== 'Excluído' && a.status !== 'Invalidada');

document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's' && S.ed && $('#b-salvar')) { e.preventDefault(); salvarEditor().catch(falha); }
  // Ctrl+Z / Ctrl+Y fora de um campo em edição: desfaz/refaz no documento (dentro do campo vale o desfazer do próprio texto)
  const emCampo = e.target.closest && e.target.closest('.ed,input,textarea,select');

    if (k === 'z' && !e.shiftKey) { e.preventDefault(); desfazer(); }

});

async function acaoAssinante(ac, id) {
  const ed = S.ed, a = ed.assin.filter(x => x.id === id)[0];
  if (!a) return;
  if (ed.sujo && (ac === 'whats' || ac === 'copiar' || ac === 'aqui')) {
    toast('Salve as alterações do documento antes de coletar assinaturas.', 'aviso'); return;
  }
  if (!baseAssinatura() && (ac === 'whats' || ac === 'copiar')) { toast('Publique o sistema como App da Web para gerar links (veja o LEIA-ME).', 'erro'); return; }
  if (baseAssinatura().endsWith('/dev') && (ac === 'whats' || ac === 'copiar')) { toast('O endereço dos links é o de teste (/dev), que não abre para outras pessoas. Informe o endereço público em Configurações › Links.', 'erro'); return; }
  if (ac === 'whats') {
    const fone = foneWhats(a.telefone);
    window.open(`https:\/\/wa.me/${fone}?text=${encodeURIComponent(mensagemWhats(a))}`, '_blank', 'noopener');
    try { a.enviadoEm = await api('marcarEnviado', { id }, { silencioso: true }); painelAssinaturas(); } catch (e) {}
  } else if (ac === 'copiar') {
    const txt = linkAssinatura(a);
    try { await navigator.clipboard.writeText(txt); toast('Link copiado.'); }
    catch (e) { abrirModal({ titulo: 'Link de assinatura', corpo: `<textarea class="mono" rows="4" readonly onclick="this.select()">${esc(txt)}</textarea>`, acoes: [{ label: 'Fechar' }] }); }
  } else if (ac === 'aqui') {
    assinarNoAparelho(a);
  } else if (ac === 'editar') {
    formAssinante(a);
  } else if (ac === 'remover') {
    if (!await confirmar('Remover assinante', `Remover <b>${esc(a.nome)}</b> da lista? O link enviado deixa de funcionar.`, 'Remover', 'btn-danger')) return;
    await gravarAssinantes(ativosAssin(ed.assin).filter(x => x.id !== id));
  } else if (ac === 'subir') {
    const l = ativosAssin(ed.assin); const i = l.findIndex(x => x.id === id);
    if (i > 0) { [l[i - 1], l[i]] = [l[i], l[i - 1]]; await gravarAssinantes(l); }
  }
}

function dadosAssinatura(px, pad) {
  const nome = $(`#${px}-nome`).value.trim(), documento = mascaraCpf($(`#${px}-doc`).value.trim());

function criarPad(canvas) {
  const ctx = canvas.getContext('2d');
  let desenhando = false, vazio = true, ult = null;
  const ajustar = () => {
    const r = canvas.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
    canvas.width = Math.max(1, r.width * dpr); canvas.height = Math.max(1, r.height * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.lineWidth = 2.4; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = '#033D60'; ctx.fillStyle = '#033D60';
    vazio = true;
  };
  const pos = e => { const r = canvas.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; };
  canvas.addEventListener('pointerdown', e => {
    e.preventDefault(); canvas.setPointerCapture(e.pointerId); desenhando = true; ult = pos(e);
    ctx.beginPath(); ctx.arc(ult.x, ult.y, 1.2, 0, Math.PI * 2); ctx.fill(); vazio = false;
  });
  canvas.addEventListener('pointermove', e => {
    if (!desenhando) return; e.preventDefault();
    const p = pos(e), m = { x: (ult.x + p.x) / 2, y: (ult.y + p.y) / 2 };
    ctx.beginPath(); ctx.moveTo(ult.x, ult.y); ctx.quadraticCurveTo(ult.x, ult.y, m.x, m.y); ctx.lineTo(p.x, p.y); ctx.stroke();
    ult = p; vazio = false;
  });
  ['pointerup', 'pointercancel', 'pointerleave'].forEach(t => canvas.addEventListener(t, () => { desenhando = false; }));
  setTimeout(ajustar, 30);
  return {
    limpar: ajustar,
    vazio: () => vazio,
    png() {
      // recorta a área desenhada e reduz para caber numa célula da planilha
      const w = canvas.width, h = canvas.height, px = ctx.getImageData(0, 0, w, h).data;
      let x0 = w, y0 = h, x1 = 0, y1 = 0;
      for (let y = 0; y < h; y += 2) for (let x = 0; x < w; x += 2) if (px[(y * w + x) * 4 + 3] > 20) { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
      if (x1 <= x0 || y1 <= y0) { x0 = 0; y0 = 0; x1 = w; y1 = h; }
      const m = 8; x0 = Math.max(0, x0 - m); y0 = Math.max(0, y0 - m); x1 = Math.min(w, x1 + m); y1 = Math.min(h, y1 + m);
      let esc_ = Math.min(1, 520 / (x1 - x0), 180 / (y1 - y0)), url = '';
      for (let i = 0; i < 6; i++) {
        const c2 = document.createElement('canvas');
        c2.width = Math.max(1, Math.round((x1 - x0) * esc_)); c2.height = Math.max(1, Math.round((y1 - y0) * esc_));
        c2.getContext('2d').drawImage(canvas, x0, y0, x1 - x0, y1 - y0, 0, 0, c2.width, c2.height);
        url = c2.toDataURL('image/png');
        if (url.length < 45000) break;
        esc_ *= 0.75;
      }
      return url;
    }
  };
}

function painelPropriedades() {
  const ed = S.ed, c = ed.c, pc = $('#painel-corpo');

async function imprimir(dados, direto) {
  const ed = S.ed;
  if (!direto && ed && ed.sujo) toast('Imprimindo a versão em edição (ainda não salva).', 'aviso');
  const temAss = (dados.assin || []).some(a => a.status === 'Assinado');
  const host = $('#impressao');
  carregando(true, 'Preparando impressão…');
  try {
    await montarDocumento(host, { modo: 'ver', c: dados.c, assin: dados.assin, meta: dados.meta, certificado: temAss });
    await Promise.all($$('#impressao img').map(i => i.complete ? null : new Promise(ok => { i.onload = i.onerror = ok; })));
  } finally { carregando(false); }
  setTimeout(() => window.print(), 60);
}
window.addEventListener('afterprint', () => { $('#impressao').innerHTML = ''; });

let libsPdf = null;
function carregarScript(src) { return new Promise((ok, erro) => { const s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = () => erro(new Error('Falha ao carregar ' + src)); document.head.appendChild(s); }); }
function carregarLibsPdf() {
  if (!libsPdf) libsPdf = Promise.all([
    carregarScript('https:\/\/cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js'),
    carregarScript('https:\/\/cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js')
  ]).catch(e => { libsPdf = null; throw e; });
  return libsPdf;
}

// Gera o PDF desenhando cada folha (mesmo layout da tela/impressão) em alta resolução.
async function gerarPdf(R) {
  await carregarLibsPdf();
  const tmp = document.createElement('div');
  tmp.className = 'papel pdf-tmp';
  document.body.appendChild(tmp);
  try {
    const pags = await montarDocumento(tmp, R);
    await Promise.all($$('img', tmp).map(i => i.complete ? null : new Promise(ok => { i.onload = i.onerror = ok; })));
    const pdf = new window.jspdf.jsPDF({ unit: 'pt', format: 'a4', compress: true });
    for (let i = 0; i < pags.length; i++) {
      $('#loading-txt').textContent = `Gerando PDF… página ${i + 1} de ${pags.length}`;
      const cv = await window.html2canvas(pags[i], { scale: 3, backgroundColor: '#ffffff', useCORS: true, logging: false, scrollX: 0, scrollY: 0 });
      if (i) pdf.addPage();
      pdf.addImage(cv.toDataURL('image/jpeg', 0.9), 'JPEG', 0, 0, 595.28, 841.89, undefined, 'FAST');
    }
    return pdf;
  } finally { tmp.remove(); }
}

function nomeArquivo(meta, c) {
  const base = meta && meta.id ? meta.id : (c.tipo + '-rascunho');
  return (base + ' ' + String((meta && meta.titulo) || c.titulo || '').replace(/^(APR|PT)\s*[-–]\s{0,}/i, '')).trim().replace(new RegExp('[' + String.fromCharCode(92, 92) + '/:*?\x22<>|]+', 'g'), '').replace(/\s+/g, ' ');
}

    toast(resumo.ativo ? 'Modelo ativado.' : 'Modelo desativado (não aparece para emissão).');
    return;
  }
  const m = await api('modelo', { id });
  if (ac === 'editar') {
    abrirEditor({ tipo: 'modelo', id: m.id, c: m.conteudo, assin: [], meta: {}, ativo: m.ativo, padrao: resumo && resumo.padrao });
    S.ed.sujo = false; barraEditor();
  } else if (ac === 'duplicar') {
    const c = clone(m.conteudo);
    c.nome = (c.nome || '') + ' (cópia)';

    abrirEditor({ tipo: 'modelo', id: null, c, assin: [], meta: {} });

    abrirEditor({ tipo: 'doc', id: null, c, assin: [], meta: { status: 'Rascunho', modeloId: m.id, vinculo: '' } });
  }
}
